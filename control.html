<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Çark Kumandası</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    .custom-scroll::-webkit-scrollbar { width: 4px; }
    .custom-scroll::-webkit-scrollbar-track { background: #09090b; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col font-sans select-none pb-6 antialiased">

  <!-- Üst Bar: Bağlantı & Durum -->
  <header class="bg-zinc-900 border-b border-zinc-800 p-4 sticky top-0 z-30">
    <div class="max-w-md mx-auto flex flex-col gap-3">
      <div class="flex items-center justify-between">
        <h1 class="font-semibold text-sm text-white">Çark Kumandası</h1>
        <div id="connBadge" class="flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-medium bg-zinc-800 text-zinc-400 border border-zinc-700">
          <span id="connDot" class="w-1.5 h-1.5 rounded-full bg-zinc-500"></span>
          <span id="connStatusText">Bağlantı Yok</span>
        </div>
      </div>

      <!-- Bağlantı Kodu Giriş Alanı -->
      <div class="flex gap-2">
        <input 
          type="text" 
          id="roomIdInput" 
          placeholder="Oda Kodu (örn: cark-4921)" 
          class="flex-1 bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-xs text-white placeholder-zinc-500 focus:outline-none focus:border-zinc-500 font-mono"
        />
        <button 
          id="connectBtn" 
          class="bg-zinc-100 hover:bg-white text-zinc-900 font-semibold px-4 py-2 rounded-lg text-xs transition">
          Bağlan
        </button>
      </div>
    </div>
  </header>

  <!-- Ana İçerik -->
  <main class="max-w-md w-full mx-auto p-4 flex-1 flex flex-col gap-4">

    <!-- 1. Hedef ve Çevirme Paneli -->
    <section class="bg-zinc-900 border border-zinc-800 rounded-xl p-4 flex flex-col gap-3">
      <div class="flex items-center justify-between border-b border-zinc-800 pb-2.5">
        <div>
          <span class="text-xs text-zinc-400">Hedef Öğrenci</span>
          <div id="targetStatusText" class="text-sm font-semibold text-zinc-200 mt-0.5">
            Rastgele (Hedef Yok)
          </div>
        </div>
        <button 
          id="resetTargetBtn" 
          class="px-2.5 py-1.5 rounded-md bg-zinc-800 border border-zinc-700 hover:bg-zinc-700 text-xs text-zinc-300 transition">
          Sıfırla
        </button>
      </div>

      <!-- Çevir Butonu -->
      <button 
        id="triggerSpinBtn" 
        disabled
        class="w-full py-3.5 px-4 rounded-lg bg-zinc-100 hover:bg-white active:scale-98 disabled:opacity-30 disabled:pointer-events-none text-zinc-900 font-bold text-sm transition">
        <span id="triggerBtnText">Çarkı Çevir</span>
      </button>
    </section>

    <!-- 2. Öğrenci Listesi Grid -->
    <section class="flex flex-col gap-3">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <h2 class="text-xs font-semibold text-zinc-400">Öğrenciler</h2>
          <span id="studentCountBadge" class="text-[11px] bg-zinc-900 border border-zinc-800 px-2 py-0.5 rounded text-zinc-400">0</span>
        </div>
        <button 
          id="toggleListEditorBtn" 
          class="text-xs text-zinc-300 hover:text-white font-medium underline underline-offset-4">
          Listeyi Düzenle
        </button>
      </div>

      <!-- Arama -->
      <input 
        type="text" 
        id="searchInput" 
        placeholder="İsim ara..." 
        class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2 text-xs text-white placeholder-zinc-500 focus:outline-none focus:border-zinc-500"
      />

      <!-- Grid -->
      <div id="studentsGrid" class="grid grid-cols-2 gap-2 max-h-[380px] overflow-y-auto custom-scroll pr-1">
      </div>
    </section>

    <!-- 3. Liste Düzenleme Modalı -->
    <div id="listEditorPanel" class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4 hidden">
      <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-5 max-w-sm w-full flex flex-col gap-3">
        <div class="flex items-center justify-between border-b border-zinc-800 pb-2">
          <h3 class="font-semibold text-white text-xs">Sınıf Listesi</h3>
          <button id="closeEditorBtn" class="text-zinc-400 hover:text-white text-xs">Kapat</button>
        </div>
        <textarea 
          id="namesTextarea" 
          rows="8" 
          class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-3 text-xs text-white font-sans focus:outline-none focus:border-zinc-500 custom-scroll resize-none"
          placeholder="Her satıra bir isim yazın"></textarea>
        
        <div class="flex items-center justify-between gap-2 pt-1">
          <button 
            id="loadDefaultBtn" 
            class="px-2.5 py-1.5 rounded-lg bg-zinc-800 text-zinc-300 hover:text-white text-xs transition">
            Örnek Liste
          </button>
          <div class="flex gap-2">
            <button 
              id="cancelEditorBtn" 
              class="px-3 py-1.5 rounded-lg bg-zinc-800 text-zinc-300 text-xs hover:bg-zinc-700 transition">
              İptal
            </button>
            <button 
              id="saveAndSyncBtn" 
              class="px-3 py-1.5 rounded-lg bg-zinc-100 hover:bg-white text-zinc-900 text-xs font-semibold transition">
              Kaydet
            </button>
          </div>
        </div>
      </div>
    </div>

  </main>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-zinc-900 border border-zinc-800 text-zinc-200 text-xs px-3.5 py-1.5 rounded-md shadow-md opacity-0 pointer-events-none transition-opacity duration-200 z-50">
    İşlem tamam
  </div>

  <script>
    const DEFAULT_NAMES = [
      "Ahmet", "Ayşe", "Mehmet", "Fatma", "Ali",
      "Zeynep", "Mustafa", "Elif", "Emre", "Burak",
      "Gamze", "Can", "Selin", "Kemal", "Büşra", "Deniz"
    ];

    let names = [];
    let selectedTarget = null;
    let isConnected = false;
    let isWheelSpinning = false;
    let peer = null;
    let conn = null;

    function loadNames() {
      const stored = localStorage.getItem('cark_names');
      if (stored) {
        try { names = JSON.parse(stored); } catch (e) { names = [...DEFAULT_NAMES]; }
      } else {
        names = [...DEFAULT_NAMES];
      }
    }

    function saveNames() {
      localStorage.setItem('cark_names', JSON.stringify(names));
    }

    function renderGrid(filter = '') {
      const grid = document.getElementById('studentsGrid');
      grid.innerHTML = '';
      
      const filtered = names.filter(n => n.toLowerCase().includes(filter.toLowerCase()));
      document.getElementById('studentCountBadge').textContent = names.length;

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-2 text-center py-6 text-xs text-zinc-500">Öğrenci bulunamadı.</div>`;
        return;
      }

      filtered.forEach(name => {
        const isSelected = selectedTarget === name;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `p-2.5 rounded-lg border text-left flex items-center justify-between transition text-xs ${
          isSelected 
            ? 'bg-zinc-100 text-zinc-900 border-white font-bold' 
            : 'bg-zinc-900 border-zinc-800 hover:border-zinc-700 text-zinc-300 hover:text-white'
        }`;

        btn.innerHTML = `
          <span class="truncate max-w-[130px]">${name}</span>
          ${isSelected ? '<span class="text-[10px] uppercase font-bold tracking-wider">Hedef</span>' : ''}
        `;

        btn.addEventListener('click', () => {
          vibrate();
          selectedTarget = (selectedTarget === name) ? null : name;
          updateTargetUI();
          renderGrid(document.getElementById('searchInput').value);
          if (conn && conn.open) {
            conn.send({ type: 'set_target', target: selectedTarget });
          }
        });

        grid.appendChild(btn);
      });
    }

    function updateTargetUI() {
      const targetText = document.getElementById('targetStatusText');
      if (selectedTarget) {
        targetText.className = 'text-sm font-bold text-amber-400';
        targetText.textContent = selectedTarget;
      } else {
        targetText.className = 'text-sm font-semibold text-zinc-200';
        targetText.textContent = 'Rastgele (Hedef Yok)';
      }
    }

    function vibrate() {
      if (navigator.vibrate) navigator.vibrate(20);
    }

    function initConnection() {
      const targetRoom = document.getElementById('roomIdInput').value.trim();
      if (!targetRoom) {
        showToast('Lütfen geçerli bir Oda Kodu girin');
        return;
      }

      localStorage.setItem('cark_last_room', targetRoom);
      setConnectionStatus('connecting', 'Bağlanıyor...');

      if (peer) {
        try { peer.destroy(); } catch (e) {}
      }

      peer = new Peer();

      peer.on('open', () => {
        conn = peer.connect(targetRoom, { reliable: true });

        conn.on('open', () => {
          isConnected = true;
          setConnectionStatus('connected', 'Bağlandı');
          showToast('Bağlantı kuruldu');
          document.getElementById('triggerSpinBtn').disabled = false;

          conn.send({
            type: 'sync_names',
            names: names
          });
        });

        conn.on('data', (data) => {
          handleIncomingData(data);
        });

        conn.on('close', () => {
          isConnected = false;
          setConnectionStatus('disconnected', 'Bağlantı Kesildi');
          document.getElementById('triggerSpinBtn').disabled = true;
        });

        conn.on('error', () => {
          setConnectionStatus('disconnected', 'Hata Oluştu');
        });
      });

      peer.on('error', () => {
        setConnectionStatus('disconnected', 'Oda Bulunamadı');
      });
    }

    function setConnectionStatus(status, text) {
      const badge = document.getElementById('connBadge');
      const dot = document.getElementById('connDot');
      const statusText = document.getElementById('connStatusText');

      statusText.textContent = text;

      if (status === 'connected') {
        badge.className = 'flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-medium bg-emerald-950/60 border border-emerald-800 text-emerald-300';
        dot.className = 'w-1.5 h-1.5 rounded-full bg-emerald-400';
      } else if (status === 'connecting') {
        badge.className = 'flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-medium bg-amber-950/60 border border-amber-800 text-amber-300';
        dot.className = 'w-1.5 h-1.5 rounded-full bg-amber-400';
      } else {
        badge.className = 'flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-medium bg-zinc-800 text-zinc-400 border border-zinc-700';
        dot.className = 'w-1.5 h-1.5 rounded-full bg-zinc-500';
      }
    }

    function handleIncomingData(data) {
      if (!data || !data.type) return;

      if (data.type === 'init') {
        setSpinningState(data.isSpinning);
      } else if (data.type === 'spin_start') {
        setSpinningState(true);
      } else if (data.type === 'spin_end') {
        setSpinningState(false);
        showToast('Kazanan: ' + data.winner);
        selectedTarget = null;
        updateTargetUI();
        renderGrid(document.getElementById('searchInput').value);
      }
    }

    function setSpinningState(spinning) {
      isWheelSpinning = spinning;
      const btn = document.getElementById('triggerSpinBtn');
      const text = document.getElementById('triggerBtnText');

      if (spinning) {
        btn.disabled = true;
        text.textContent = 'Dönüyor...';
      } else {
        btn.disabled = !isConnected;
        text.textContent = 'Çarkı Çevir';
      }
    }

    document.getElementById('triggerSpinBtn').addEventListener('click', () => {
      if (!isConnected || !conn || !conn.open || isWheelSpinning) return;
      vibrate();
      conn.send({
        type: 'spin',
        target: selectedTarget
      });
      showToast(selectedTarget ? `Hedef ile tetiklendi: ${selectedTarget}` : 'Rastgele tetiklendi');
    });

    document.getElementById('resetTargetBtn').addEventListener('click', () => {
      vibrate();
      selectedTarget = null;
      updateTargetUI();
      renderGrid(document.getElementById('searchInput').value);
      if (conn && conn.open) {
        conn.send({ type: 'set_target', target: null });
      }
      showToast('Hedef sıfırlandı');
    });

    document.getElementById('searchInput').addEventListener('input', (e) => {
      renderGrid(e.target.value);
    });

    document.getElementById('connectBtn').addEventListener('click', initConnection);
    document.getElementById('roomIdInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') initConnection();
    });

    const listPanel = document.getElementById('listEditorPanel');
    const textarea = document.getElementById('namesTextarea');

    document.getElementById('toggleListEditorBtn').addEventListener('click', () => {
      textarea.value = names.join('\n');
      listPanel.classList.remove('hidden');
    });

    function closeEditor() {
      listPanel.classList.add('hidden');
    }

    document.getElementById('closeEditorBtn').addEventListener('click', closeEditor);
    document.getElementById('cancelEditorBtn').addEventListener('click', closeEditor);

    document.getElementById('loadDefaultBtn').addEventListener('click', () => {
      textarea.value = DEFAULT_NAMES.join('\n');
    });

    document.getElementById('saveAndSyncBtn').addEventListener('click', () => {
      const parsed = textarea.value
        .split('\n')
        .map(n => n.trim())
        .filter(n => n.length > 0);

      if (parsed.length === 0) {
        showToast('En az 1 isim girmelisiniz');
        return;
      }

      names = parsed;
      saveNames();
      renderGrid(document.getElementById('searchInput').value);
      closeEditor();

      if (conn && conn.open) {
        conn.send({
          type: 'sync_names',
          names: names
        });
        showToast('Liste güncellendi (' + names.length + ' kişi)');
      } else {
        showToast('Liste kaydedildi (' + names.length + ' kişi)');
      }
    });

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.remove('opacity-0');
      setTimeout(() => {
        toast.classList.add('opacity-0');
      }, 2000);
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadNames();
      renderGrid();
      updateTargetUI();

      const urlParams = new URLSearchParams(window.location.search);
      const roomParam = urlParams.get('room') || localStorage.getItem('cark_last_room');
      if (roomParam) {
        document.getElementById('roomIdInput').value = roomParam;
        if (urlParams.get('room')) {
          setTimeout(initConnection, 300);
        }
      }
    });
  </script>
</body>
</html>
