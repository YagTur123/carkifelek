<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Çark Kumandası</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://unpkg.com/mqtt@5.3.5/dist/mqtt.min.js"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    .custom-scroll::-webkit-scrollbar { width: 4px; }
    .custom-scroll::-webkit-scrollbar-track { background: #090d0a; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #272017; border-radius: 4px; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col font-sans select-none pb-6 antialiased">

  <!-- Üst Bar: Bağlantı & Durum -->
  <header class="bg-zinc-900 border-b border-zinc-800 p-4 sticky top-0 z-30">
    <div class="max-w-md mx-auto flex flex-col gap-3">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="w-2 h-4 bg-amber-500 rounded-sm"></div>
          <h1 class="font-bold text-sm text-amber-100 font-serif">Kumanda Paneli</h1>
        </div>
        <div id="connBadge" class="flex items-center gap-1.5 px-2.5 py-1 rounded text-xs font-medium bg-zinc-800 text-zinc-400 border border-zinc-700">
          <span id="connDot" class="w-1.5 h-1.5 rounded-full bg-zinc-500"></span>
          <span id="connStatusText">Bağlantı Yok</span>
        </div>
      </div>

      <!-- 1. CANLI AÇIK TAHTALAR (Otomatik Keşif Listesi) -->
      <div id="lobbyContainer" class="flex flex-col gap-1.5 bg-zinc-950 p-2.5 rounded border border-zinc-800">
        <div class="flex items-center justify-between">
          <span class="text-[11px] font-semibold text-zinc-400 flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            Açık Tahtalar (Canlı Keşif)
          </span>
          <button id="toggleManualCodeBtn" class="text-[11px] text-amber-400 hover:text-amber-300">
            Manuel Kod
          </button>
        </div>

        <div id="activeRoomsList" class="space-y-1.5 mt-1">
          <div class="text-[11px] text-zinc-500 py-1 text-center italic">Açık tahtalar taranıyor...</div>
        </div>

        <!-- Manuel Kod Giriş Alanı (İsteğe Bağlı Gizlenebilir) -->
        <div id="manualCodeArea" class="hidden flex gap-2 pt-2 border-t border-zinc-800/80">
          <input 
            type="text" 
            id="roomIdInput" 
            placeholder="Oda Kodu (örn: cark-4921)" 
            class="flex-1 bg-zinc-900 border border-zinc-800 rounded px-2.5 py-1.5 text-xs text-white placeholder-zinc-500 focus:outline-none focus:border-amber-600 font-mono"
          />
          <button 
            id="connectBtn" 
            class="bg-amber-500 hover:bg-amber-400 text-black font-bold px-3 py-1.5 rounded text-xs transition">
            Bağlan
          </button>
        </div>
      </div>

    </div>
  </header>

  <!-- Ana İçerik -->
  <main class="max-w-md w-full mx-auto p-4 flex-1 flex flex-col gap-4">

    <!-- Hedef ve Çevirme Paneli -->
    <section class="bg-zinc-900 border border-amber-900/40 rounded-xl p-4 flex flex-col gap-3 shadow-md">
      <div class="flex items-center justify-between border-b border-zinc-800 pb-2.5">
        <div>
          <span class="text-[11px] text-zinc-400 font-medium">Gizli Hedef</span>
          <div id="targetStatusText" class="text-sm font-bold text-zinc-200 mt-0.5">
            Rastgele (Hedef Yok)
          </div>
        </div>
        <button 
          id="resetTargetBtn" 
          class="px-2.5 py-1.5 rounded bg-zinc-800 border border-zinc-700 hover:bg-zinc-700 text-xs text-zinc-300 transition">
          Hedefi Sıfırla
        </button>
      </div>

      <!-- Çevir Butonu -->
      <button 
        id="triggerSpinBtn" 
        disabled
        class="w-full py-3.5 px-4 rounded-lg bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 active:scale-98 disabled:opacity-30 disabled:pointer-events-none text-black font-black text-sm tracking-wide transition shadow">
        <span id="triggerBtnText">ÇARKI UZAKTAN ÇEVİR</span>
      </button>

      <!-- Otomatik Eleme Ayarı -->
      <div class="flex items-center justify-between pt-1">
        <span class="text-xs text-zinc-400">Kazanan Çarktan Çıksın (Eleme)</span>
        <label class="relative inline-flex items-center cursor-pointer">
          <input type="checkbox" id="autoRemoveToggle" class="sr-only peer">
          <div class="w-9 h-5 bg-zinc-800 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-zinc-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-amber-600"></div>
        </label>
      </div>
    </section>

    <!-- Son Kazanan Bildirim Kartı -->
    <div id="lastWinnerCard" class="hidden bg-zinc-900 border border-amber-500/50 rounded-xl p-3 flex items-center justify-between">
      <div>
        <span class="text-[10px] text-amber-400 uppercase tracking-wider font-semibold">Son Kazanan</span>
        <div id="lastWinnerName" class="text-base font-bold text-white font-serif">Ahmet</div>
      </div>
      <button 
        id="removeLastWinnerBtn" 
        class="px-3 py-1.5 rounded bg-rose-950 border border-rose-800 hover:bg-rose-900 text-rose-300 text-xs font-semibold transition">
        Listeden Çıkar
      </button>
    </div>

    <!-- Sekmeler: Öğrenciler / Çekiliş Geçmişi (Log) -->
    <div class="flex border-b border-zinc-800 text-xs font-medium">
      <button id="tabStudentsBtn" class="flex-1 py-2 text-center text-amber-400 border-b-2 border-amber-500 font-semibold">
        Öğrenci Listesi (<span id="tabStudentCount">0</span>)
      </button>
      <button id="tabHistoryBtn" class="flex-1 py-2 text-center text-zinc-400 hover:text-zinc-200">
        Çekiliş Geçmişi (<span id="tabHistoryCount">0</span>)
      </button>
    </div>

    <!-- 2. Öğrenci Listesi Sekmesi -->
    <section id="studentsSection" class="flex flex-col gap-3">
      <div class="flex items-center justify-between">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="İsim ara..." 
          class="flex-1 bg-zinc-900 border border-zinc-800 rounded px-3 py-2 text-xs text-white placeholder-zinc-500 focus:outline-none focus:border-amber-600 mr-2"
        />
        <button 
          id="toggleListEditorBtn" 
          class="text-xs text-amber-300 hover:text-amber-200 font-medium px-2 py-2 rounded bg-zinc-900 border border-zinc-800 whitespace-nowrap">
          Düzenle
        </button>
      </div>

      <!-- Grid -->
      <div id="studentsGrid" class="grid grid-cols-2 gap-2 max-h-[340px] overflow-y-auto custom-scroll pr-1">
      </div>
    </section>

    <!-- 3. Çekiliş Geçmişi (Log) Sekmesi -->
    <section id="historySection" class="hidden flex flex-col gap-3">
      <div class="flex items-center justify-between">
        <span class="text-xs text-zinc-400">Tur Kayıtları</span>
        <button id="clearAllHistoryBtn" class="text-xs text-zinc-500 hover:text-rose-400 transition">
          Geçmişi Sıfırla
        </button>
      </div>
      <div id="historyLogList" class="space-y-2 max-h-[340px] overflow-y-auto custom-scroll pr-1">
        <div class="text-center py-6 text-xs text-zinc-600">Henüz çekiliş kaydı yok.</div>
      </div>
    </section>

    <!-- Liste Düzenleme Modalı -->
    <div id="listEditorPanel" class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4 hidden">
      <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-5 max-w-sm w-full flex flex-col gap-3">
        <div class="flex items-center justify-between border-b border-zinc-800 pb-2">
          <h3 class="font-semibold text-white text-xs">Sınıf Listesi Düzenleyici</h3>
          <button id="closeEditorBtn" class="text-zinc-400 hover:text-white text-xs">Kapat</button>
        </div>
        <textarea 
          id="namesTextarea" 
          rows="8" 
          class="w-full bg-zinc-950 border border-zinc-800 rounded p-3 text-xs text-white font-sans focus:outline-none focus:border-amber-600 custom-scroll resize-none"
          placeholder="Her satıra bir isim yazın"></textarea>
        
        <div class="flex items-center justify-between gap-2 pt-1">
          <button 
            id="loadDefaultBtn" 
            class="px-2.5 py-1.5 rounded bg-zinc-800 text-zinc-300 hover:text-white text-xs transition">
            Örnek Liste
          </button>
          <div class="flex gap-2">
            <button 
              id="cancelEditorBtn" 
              class="px-3 py-1.5 rounded bg-zinc-800 text-zinc-300 text-xs hover:bg-zinc-700 transition">
              İptal
            </button>
            <button 
              id="saveAndSyncBtn" 
              class="px-3 py-1.5 rounded bg-amber-500 hover:bg-amber-400 text-black text-xs font-bold transition">
              Kaydet ve Gönder
            </button>
          </div>
        </div>
      </div>
    </div>

  </main>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-zinc-900 border border-amber-600/50 text-amber-200 text-xs px-3.5 py-1.5 rounded shadow-lg opacity-0 pointer-events-none transition-opacity duration-200 z-50">
    İşlem tamam
  </div>

  <script>
    const DEFAULT_NAMES = [
      "Ahmet", "Ayşe", "Mehmet", "Fatma", "Ali",
      "Zeynep", "Mustafa", "Elif", "Emre", "Burak",
      "Gamze", "Can", "Selin", "Kemal", "Büşra", "Deniz"
    ];

    let names = [];
    let history = [];
    let selectedTarget = null;
    let isConnected = false;
    let isWheelSpinning = false;
    let lastWinner = null;
    let peer = null;
    let conn = null;

    // Canlı Keşfedilen Odalar (Lobby Map)
    const discoveredRooms = new Map();
    let mqttClient = null;

    function loadStorage() {
      const storedNames = localStorage.getItem('cark_names');
      if (storedNames) {
        try { names = JSON.parse(storedNames); } catch (e) { names = [...DEFAULT_NAMES]; }
      } else {
        names = [...DEFAULT_NAMES];
      }
      const storedHistory = localStorage.getItem('cark_history');
      if (storedHistory) {
        try { history = JSON.parse(storedHistory); } catch (e) { history = []; }
      }
    }

    function saveStorage() {
      localStorage.setItem('cark_names', JSON.stringify(names));
      localStorage.setItem('cark_history', JSON.stringify(history));
    }

    // --- MQTT Canlı Tahta Keşfi ---
    function initLobbyDiscovery() {
      try {
        mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
          clientId: 'ctrl_' + Math.random().toString(16).substring(2, 8),
          clean: true,
          connectTimeout: 4000
        });

        mqttClient.on('connect', () => {
          mqttClient.subscribe('carkifelek_public_rooms');
        });

        mqttClient.on('message', (topic, message) => {
          try {
            const data = JSON.parse(message.toString());
            if (data.roomId && data.lastSeen) {
              discoveredRooms.set(data.roomId, data);
              renderActiveRoomsList();
            }
          } catch (e) {}
        });

        // 8 saniyeden eski sinyalleri temizle
        setInterval(() => {
          const now = Date.now();
          let changed = false;
          for (const [roomId, room] of discoveredRooms.entries()) {
            if (now - room.lastSeen > 8000) {
              discoveredRooms.delete(roomId);
              changed = true;
            }
          }
          if (changed) renderActiveRoomsList();
        }, 3000);

      } catch (e) {
        console.warn('Lobby discovery error:', e);
      }
    }

    function renderActiveRoomsList() {
      const listEl = document.getElementById('activeRoomsList');
      const rooms = Array.from(discoveredRooms.values());

      if (rooms.length === 0) {
        listEl.innerHTML = `<div class="text-[11px] text-zinc-500 py-1 text-center italic">Açık tahta aranıyor (Tahtadaki sayfayı açın)...</div>`;
        return;
      }

      listEl.innerHTML = rooms.map(room => `
        <div class="flex items-center justify-between p-2 rounded bg-zinc-900 border border-zinc-800 hover:border-amber-600/70 transition">
          <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
            <div>
              <div class="text-xs font-semibold text-zinc-200">${room.title || room.roomId}</div>
              <div class="text-[10px] text-zinc-500 font-mono">${room.roomId} · ${room.studentCount || 0} kişi</div>
            </div>
          </div>
          <button 
            onclick="connectToRoom('${room.roomId}')"
            class="px-3 py-1 rounded bg-amber-500 hover:bg-amber-400 text-black font-bold text-xs transition">
            Bağlan
          </button>
        </div>
      `).join('');
    }

    window.connectToRoom = function(targetRoom) {
      document.getElementById('roomIdInput').value = targetRoom;
      initConnection();
    };

    function renderGrid(filter = '') {
      const grid = document.getElementById('studentsGrid');
      grid.innerHTML = '';
      
      const filtered = names.filter(n => n.toLowerCase().includes(filter.toLowerCase()));
      document.getElementById('tabStudentCount').textContent = names.length;

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-2 text-center py-6 text-xs text-zinc-500">Öğrenci bulunamadı.</div>`;
        return;
      }

      filtered.forEach(name => {
        const isSelected = selectedTarget === name;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `p-2.5 rounded border text-left flex items-center justify-between transition text-xs ${
          isSelected 
            ? 'bg-amber-500/20 text-amber-200 border-amber-500 font-bold' 
            : 'bg-zinc-900 border-zinc-800 hover:border-zinc-700 text-zinc-300 hover:text-white'
        }`;

        btn.innerHTML = `
          <span class="truncate max-w-[120px]">${name}</span>
          ${isSelected ? '<span class="text-[10px] text-amber-400 font-bold uppercase tracking-wider">Hedef</span>' : ''}
        `;

        btn.addEventListener('click', () => {
          vibrate();
          selectedTarget = (selectedTarget === name) ? null : name;
          updateTargetUI();
          renderGrid(document.getElementById('searchInput').value);
          if (conn && conn.open) conn.send({ type: 'set_target', target: selectedTarget });
        });

        grid.appendChild(btn);
      });
    }

    function updateTargetUI() {
      const targetText = document.getElementById('targetStatusText');
      if (selectedTarget) {
        targetText.className = 'text-sm font-bold text-amber-400';
        targetText.textContent = selectedTarget;
      } else {
        targetText.className = 'text-sm font-semibold text-zinc-200';
        targetText.textContent = 'Rastgele (Hedef Yok)';
      }
    }

    function renderHistoryUI() {
      const list = document.getElementById('historyLogList');
      document.getElementById('tabHistoryCount').textContent = history.length;

      if (history.length === 0) {
        list.innerHTML = `<div class="text-center py-6 text-xs text-zinc-600">Henüz çekiliş kaydı yok.</div>`;
        return;
      }

      list.innerHTML = history.map(item => `
        <div class="flex items-center justify-between p-2.5 rounded bg-zinc-900 border border-zinc-800 text-xs">
          <div class="flex items-center gap-2">
            <span class="text-amber-500 font-mono font-bold">#${item.round}</span>
            <span class="text-zinc-200 font-semibold">${item.winner}</span>
            ${item.wasTargeted ? '<span class="text-[9px] px-1 py-0.5 rounded bg-amber-950 text-amber-400 border border-amber-800">Hedef</span>' : ''}
          </div>
          <span class="text-[10px] text-zinc-500 font-mono">${item.time}</span>
        </div>
      `).join('');
    }

    function vibrate() {
      if (navigator.vibrate) navigator.vibrate(20);
    }

    // --- PeerJS Bağlantısı ---
    function initConnection() {
      const targetRoom = document.getElementById('roomIdInput').value.trim();
      if (!targetRoom) {
        showToast('Lütfen geçerli bir Oda Kodu girin');
        return;
      }

      localStorage.setItem('cark_last_room', targetRoom);
      setConnectionStatus('connecting', 'Bağlanıyor...');

      if (peer) {
        try { peer.destroy(); } catch (e) {}
      }

      peer = new Peer();

      peer.on('open', () => {
        conn = peer.connect(targetRoom, { reliable: true });

        conn.on('open', () => {
          isConnected = true;
          setConnectionStatus('connected', 'Bağlandı (' + targetRoom + ')');
          showToast('Tahtaya bağlandı!');
          document.getElementById('triggerSpinBtn').disabled = false;

          conn.send({
            type: 'sync_names',
            names: names
          });
        });

        conn.on('data', (data) => handleIncomingData(data));

        conn.on('close', () => {
          isConnected = false;
          setConnectionStatus('disconnected', 'Bağlantı Kesildi');
          document.getElementById('triggerSpinBtn').disabled = true;
        });

        conn.on('error', () => {
          setConnectionStatus('disconnected', 'Hata');
        });
      });

      peer.on('error', () => {
        setConnectionStatus('disconnected', 'Bulunamadı');
      });
    }

    function setConnectionStatus(status, text) {
      const badge = document.getElementById('connBadge');
      const dot = document.getElementById('connDot');
      const statusText = document.getElementById('connStatusText');

      statusText.textContent = text;

      if (status === 'connected') {
        badge.className = 'flex items-center gap-1.5 px-2.5 py-1 rounded text-xs font-medium bg-emerald-950/60 border border-emerald-800 text-emerald-300';
        dot.className = 'w-1.5 h-1.5 rounded-full bg-emerald-400';
      } else if (status === 'connecting') {
        badge.className = 'flex items-center gap-1.5 px-2.5 py-1 rounded text-xs font-medium bg-amber-950/60 border border-amber-800 text-amber-300';
        dot.className = 'w-1.5 h-1.5 rounded-full bg-amber-400';
      } else {
        badge.className = 'flex items-center gap-1.5 px-2.5 py-1 rounded text-xs font-medium bg-zinc-800 text-zinc-400 border border-zinc-700';
        dot.className = 'w-1.5 h-1.5 rounded-full bg-zinc-500';
      }
    }

    function handleIncomingData(data) {
      if (!data || !data.type) return;

      if (data.type === 'init') {
        if (data.history) history = data.history;
        if (data.names && data.names.length) names = data.names;
        saveStorage();
        renderGrid();
        renderHistoryUI();
        setSpinningState(data.isSpinning);
      } else if (data.type === 'names_updated') {
        names = data.names;
        saveStorage();
        renderGrid();
      } else if (data.type === 'spin_start') {
        setSpinningState(true);
      } else if (data.type === 'spin_end') {
        setSpinningState(false);
        lastWinner = data.winner;
        
        document.getElementById('lastWinnerCard').classList.remove('hidden');
        document.getElementById('lastWinnerName').textContent = lastWinner;

        if (data.history) history = data.history;
        saveStorage();
        renderHistoryUI();

        if (document.getElementById('autoRemoveToggle').checked) {
          removeStudent(lastWinner);
        }

        showToast('Kazanan: ' + data.winner);
        selectedTarget = null;
        updateTargetUI();
        renderGrid(document.getElementById('searchInput').value);
      }
    }

    function setSpinningState(spinning) {
      isWheelSpinning = spinning;
      const btn = document.getElementById('triggerSpinBtn');
      const text = document.getElementById('triggerBtnText');

      if (spinning) {
        btn.disabled = true;
        text.textContent = 'ÇARK DÖNÜYOR...';
      } else {
        btn.disabled = !isConnected;
        text.textContent = 'ÇARKI UZAKTAN ÇEVİR';
      }
    }

    function removeStudent(studentName) {
      names = names.filter(n => n !== studentName);
      saveStorage();
      renderGrid(document.getElementById('searchInput').value);
      document.getElementById('lastWinnerCard').classList.add('hidden');

      if (conn && conn.open) {
        conn.send({
          type: 'remove_name',
          name: studentName
        });
      }
      showToast(studentName + ' listeden elendi');
    }

    document.getElementById('removeLastWinnerBtn').addEventListener('click', () => {
      if (lastWinner) removeStudent(lastWinner);
    });

    document.getElementById('triggerSpinBtn').addEventListener('click', () => {
      if (!isConnected || !conn || !conn.open || isWheelSpinning) return;
      vibrate();
      conn.send({
        type: 'spin',
        target: selectedTarget
      });
      showToast(selectedTarget ? `Hedef ile çevrildi: ${selectedTarget}` : 'Rastgele çevrildi');
    });

    document.getElementById('resetTargetBtn').addEventListener('click', () => {
      vibrate();
      selectedTarget = null;
      updateTargetUI();
      renderGrid(document.getElementById('searchInput').value);
      if (conn && conn.open) conn.send({ type: 'set_target', target: null });
      showToast('Hedef sıfırlandı');
    });

    // Sekmeler
    const tabStudentsBtn = document.getElementById('tabStudentsBtn');
    const tabHistoryBtn = document.getElementById('tabHistoryBtn');
    const studentsSection = document.getElementById('studentsSection');
    const historySection = document.getElementById('historySection');

    tabStudentsBtn.addEventListener('click', () => {
      tabStudentsBtn.className = 'flex-1 py-2 text-center text-amber-400 border-b-2 border-amber-500 font-semibold';
      tabHistoryBtn.className = 'flex-1 py-2 text-center text-zinc-400 hover:text-zinc-200';
      studentsSection.classList.remove('hidden');
      historySection.classList.add('hidden');
    });

    tabHistoryBtn.addEventListener('click', () => {
      tabHistoryBtn.className = 'flex-1 py-2 text-center text-amber-400 border-b-2 border-amber-500 font-semibold';
      tabStudentsBtn.className = 'flex-1 py-2 text-center text-zinc-400 hover:text-zinc-200';
      studentsSection.classList.add('hidden');
      historySection.classList.remove('hidden');
    });

    document.getElementById('clearAllHistoryBtn').addEventListener('click', () => {
      if (confirm('Geçmişi sıfırlamak istiyor musunuz?')) {
        history = [];
        saveStorage();
        renderHistoryUI();
        if (conn && conn.open) conn.send({ type: 'clear_history' });
        showToast('Geçmiş temizlendi');
      }
    });

    document.getElementById('toggleManualCodeBtn').addEventListener('click', () => {
      document.getElementById('manualCodeArea').classList.toggle('hidden');
    });

    document.getElementById('searchInput').addEventListener('input', (e) => {
      renderGrid(e.target.value);
    });

    document.getElementById('connectBtn').addEventListener('click', initConnection);
    document.getElementById('roomIdInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') initConnection();
    });

    // Liste Düzenleyici
    const listPanel = document.getElementById('listEditorPanel');
    const textarea = document.getElementById('namesTextarea');

    document.getElementById('toggleListEditorBtn').addEventListener('click', () => {
      textarea.value = names.join('\n');
      listPanel.classList.remove('hidden');
    });

    function closeEditor() { listPanel.classList.add('hidden'); }
    document.getElementById('closeEditorBtn').addEventListener('click', closeEditor);
    document.getElementById('cancelEditorBtn').addEventListener('click', closeEditor);

    document.getElementById('loadDefaultBtn').addEventListener('click', () => {
      textarea.value = DEFAULT_NAMES.join('\n');
    });

    document.getElementById('saveAndSyncBtn').addEventListener('click', () => {
      const parsed = textarea.value
        .split('\n')
        .map(n => n.trim())
        .filter(n => n.length > 0);

      if (parsed.length === 0) {
        showToast('En az 1 isim girmelisiniz');
        return;
      }

      names = parsed;
      saveStorage();
      renderGrid(document.getElementById('searchInput').value);
      closeEditor();

      if (conn && conn.open) {
        conn.send({
          type: 'sync_names',
          names: names
        });
        showToast('Liste gönderildi (' + names.length + ' kişi)');
      }
    });

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.remove('opacity-0');
      setTimeout(() => { toast.classList.add('opacity-0'); }, 2000);
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadStorage();
      renderGrid();
      renderHistoryUI();
      updateTargetUI();
      initLobbyDiscovery();

      const urlParams = new URLSearchParams(window.location.search);
      const roomParam = urlParams.get('room') || localStorage.getItem('cark_last_room');
      if (roomParam) {
        document.getElementById('roomIdInput').value = roomParam;
        if (urlParams.get('room')) setTimeout(initConnection, 300);
      }
    });
  </script>
</body>
</html>
