<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Çark Kumandası (Gizli Panel)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PeerJS -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    /* Dokunmatik seçim engelleme ve pürüzsüz kaydırma */
    * { -webkit-tap-highlight-color: transparent; }
    .custom-scroll::-webkit-scrollbar { width: 5px; }
    .custom-scroll::-webkit-scrollbar-track { background: #0f172a; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans select-none pb-6">

  <!-- Üst Bar: Bağlantı & Durum -->
  <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-30 shadow-lg">
    <div class="max-w-xl mx-auto flex flex-col gap-3">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="text-xl">🎮</span>
          <h1 class="font-bold text-base tracking-tight text-white">Çark Uzaktan Kumandası</h1>
        </div>
        <div id="connBadge" class="flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-rose-950/80 border border-rose-800/60 text-rose-300">
          <span id="connDot" class="w-2 h-2 rounded-full bg-rose-500"></span>
          <span id="connStatusText">Bağlantı Yok</span>
        </div>
      </div>

      <!-- Bağlantı Kodu Giriş Alanı -->
      <div class="flex gap-2">
        <div class="relative flex-1">
          <input 
            type="text" 
            id="roomIdInput" 
            placeholder="Oda Kodu (örn: cark-4921)" 
            class="w-full bg-slate-950 border border-slate-700/80 rounded-xl px-3.5 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 font-mono tracking-wider"
          />
        </div>
        <button 
          id="connectBtn" 
          class="bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-medium px-4 py-2 rounded-xl text-sm transition shadow-md flex items-center justify-center min-w-[90px]">
          Bağlan
        </button>
      </div>
    </div>
  </header>

  <!-- Ana İçerik -->
  <main class="max-w-xl w-full mx-auto p-4 flex-1 flex flex-col gap-5">

    <!-- 1. HİLE VE TETİKLEME KONTROL MERKEZİ (Sticky Eylem Kartı) -->
    <section class="bg-gradient-to-b from-slate-900 to-slate-900/90 border border-slate-800 rounded-2xl p-4 shadow-xl flex flex-col gap-3">
      <div class="flex items-center justify-between border-b border-slate-800/80 pb-3">
        <div class="flex flex-col">
          <span class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Aktif Hedef Kurban</span>
          <div class="flex items-center gap-2 mt-0.5">
            <span id="targetStatusText" class="text-lg font-black text-emerald-400 flex items-center gap-1.5">
              <span>🎲</span> Tamamen Rastgele
            </span>
          </div>
        </div>
        <button 
          id="resetTargetBtn" 
          class="px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 hover:bg-slate-700 active:scale-95 text-xs text-slate-300 transition flex items-center gap-1">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          Sıfırla
        </button>
      </div>

      <!-- BÜYÜK ÇEVİR BUTONU -->
      <button 
        id="triggerSpinBtn" 
        disabled
        class="w-full py-4 px-6 rounded-2xl bg-gradient-to-r from-emerald-600 via-teal-600 to-emerald-700 hover:from-emerald-500 hover:to-teal-600 active:scale-98 disabled:opacity-40 disabled:pointer-events-none text-white font-extrabold text-base md:text-lg shadow-xl shadow-emerald-900/30 flex items-center justify-center gap-2 transition duration-200">
        <span class="text-xl">🎰</span>
        <span id="triggerBtnText">ÇARKI UZAKTAN ÇEVİR</span>
      </button>

      <p class="text-[11px] text-center text-slate-500">
        Butona bastığınızda hedef belirlenmişse çark <span class="text-amber-400 font-semibold">fark ettirmeden</span> hedefe oturur.
      </p>
    </section>

    <!-- 2. HEDEF SEÇİMİ (ÖĞRENCİ GRID) -->
    <section class="flex flex-col gap-3">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <h2 class="text-sm font-bold text-slate-300">Öğrenci Listesi</h2>
          <span id="studentCountBadge" class="text-xs bg-slate-800 border border-slate-700 px-2 py-0.5 rounded-full text-slate-400">0</span>
        </div>
        <div class="flex items-center gap-2">
          <button 
            id="toggleListEditorBtn" 
            class="text-xs text-indigo-400 hover:text-indigo-300 font-medium flex items-center gap-1">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
            Listeyi Düzenle
          </button>
        </div>
      </div>

      <!-- Hızlı Filtre Arama -->
      <div class="relative">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="İsim ara..." 
          class="w-full bg-slate-900/80 border border-slate-800 rounded-xl pl-9 pr-3.5 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500"
        />
        <svg class="w-4 h-4 text-slate-500 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      </div>

      <!-- Öğrenci Butonları Grid -->
      <div id="studentsGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-2 max-h-[380px] overflow-y-auto custom-scroll pr-1">
        <!-- JS ile doldurulacak -->
      </div>
    </section>

    <!-- 3. LİSTE DÜZENLEYİCİ (MODAL/PANEL) -->
    <div id="listEditorPanel" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 max-w-md w-full shadow-2xl flex flex-col gap-4">
        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
          <h3 class="font-bold text-white text-sm">Sınıf Listesini Düzenle</h3>
          <button id="closeEditorBtn" class="text-slate-400 hover:text-white p-1">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
        <p class="text-xs text-slate-400">
          Her satıra bir isim gelecek şekilde sınıf listenizi yapıştırın:
        </p>
        <textarea 
          id="namesTextarea" 
          rows="8" 
          class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white font-mono focus:outline-none focus:border-indigo-500 custom-scroll resize-none"
          placeholder="Ahmet&#10;Ayşe&#10;Mehmet..."></textarea>
        
        <div class="flex items-center justify-between gap-2 pt-2">
          <button 
            id="loadDefaultBtn" 
            class="px-3 py-2 rounded-xl bg-slate-800 text-slate-300 hover:text-white text-xs transition">
            Örnek Liste
          </button>
          <div class="flex gap-2">
            <button 
              id="cancelEditorBtn" 
              class="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs hover:bg-slate-700 transition">
              İptal
            </button>
            <button 
              id="saveAndSyncBtn" 
              class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold transition shadow">
              Kaydet ve Tahtaya Gönder
            </button>
          </div>
        </div>
      </div>
    </div>

  </main>

  <!-- Bildirim Kutusu (Toast) -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 border border-slate-700 text-white text-xs px-4 py-2 rounded-xl shadow-2xl opacity-0 pointer-events-none transition-all duration-200 z-50">
    İşlem başarılı
  </div>

  <script>
    // --- Varsayılan İsimler & Durum ---
    const DEFAULT_NAMES = [
      "Ahmet", "Ayşe", "Mehmet", "Fatma", "Ali",
      "Zeynep", "Mustafa", "Elif", "Emre", "Burak",
      "Gamze", "Can", "Selin", "Kemal", "Büşra", "Deniz"
    ];

    let names = [];
    let selectedTarget = null; // null ise Rastgele
    let isConnected = false;
    let isWheelSpinning = false;
    let peer = null;
    let conn = null;

    // Yerel Hafızadan Yükle
    function loadNames() {
      const stored = localStorage.getItem('cark_names');
      if (stored) {
        try {
          names = JSON.parse(stored);
        } catch (e) {
          names = [...DEFAULT_NAMES];
        }
      } else {
        names = [...DEFAULT_NAMES];
      }
    }

    function saveNames() {
      localStorage.setItem('cark_names', JSON.stringify(names));
    }

    // Arayüzü Güncelle
    function renderGrid(filter = '') {
      const grid = document.getElementById('studentsGrid');
      grid.innerHTML = '';
      
      const filtered = names.filter(n => n.toLowerCase().includes(filter.toLowerCase()));
      document.getElementById('studentCountBadge').textContent = names.length;

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-2 sm:col-span-3 text-center py-6 text-xs text-slate-500">Öğrenci bulunamadı.</div>`;
        return;
      }

      filtered.forEach(name => {
        const isSelected = selectedTarget === name;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `p-3 rounded-xl border text-left flex items-center justify-between transition-all duration-150 active:scale-95 ${
          isSelected 
            ? 'bg-rose-950/70 border-rose-500 text-white shadow-lg shadow-rose-950/40 ring-2 ring-rose-500/50' 
            : 'bg-slate-900/80 border-slate-800 hover:border-slate-700 text-slate-300 hover:text-white'
        }`;

        btn.innerHTML = `
          <span class="font-medium text-xs truncate max-w-[120px]">${name}</span>
          ${isSelected ? '<span class="text-xs text-rose-400 font-black animate-pulse">🎯 HEDEF</span>' : '<span class="text-[10px] text-slate-600">Seç</span>'}
        `;

        btn.addEventListener('click', () => {
          vibrate();
          if (selectedTarget === name) {
            // İkinci tıklamada hedefi kaldır
            selectedTarget = null;
          } else {
            selectedTarget = name;
          }
          updateTargetUI();
          renderGrid(document.getElementById('searchInput').value);
          // Tahtaya hedef bilgisini ilet
          if (conn && conn.open) {
            conn.send({ type: 'set_target', target: selectedTarget });
          }
        });

        grid.appendChild(btn);
      });
    }

    function updateTargetUI() {
      const targetText = document.getElementById('targetStatusText');
      if (selectedTarget) {
        targetText.className = 'text-lg font-black text-rose-400 flex items-center gap-1.5 animate-pulse';
        targetText.innerHTML = `<span>🎯</span> ${selectedTarget}`;
      } else {
        targetText.className = 'text-lg font-black text-emerald-400 flex items-center gap-1.5';
        targetText.innerHTML = `<span>🎲</span> Tamamen Rastgele`;
      }
    }

    function vibrate() {
      if (navigator.vibrate) {
        navigator.vibrate(25);
      }
    }

    // --- PeerJS WebRTC Bağlantı Mantığı ---
    function initConnection() {
      const targetRoom = document.getElementById('roomIdInput').value.trim();
      if (!targetRoom) {
        showToast('Lütfen geçerli bir Oda Kodu girin');
        return;
      }

      localStorage.setItem('cark_last_room', targetRoom);

      setConnectionStatus('connecting', 'Bağlanıyor...');

      if (peer) {
        try { peer.destroy(); } catch (e) {}
      }

      // Kumanda için rastgele istemci Peer oluştur
      peer = new Peer();

      peer.on('open', (id) => {
        conn = peer.connect(targetRoom, { reliable: true });

        conn.on('open', () => {
          isConnected = true;
          setConnectionStatus('connected', 'Bağlandı');
          showToast('Tahtaya başarıyla bağlandı!');
          document.getElementById('triggerSpinBtn').disabled = false;

          // Mevcut listeyi tahtaya senkronize et
          conn.send({
            type: 'sync_names',
            names: names
          });
        });

        conn.on('data', (data) => {
          handleIncomingData(data);
        });

        conn.on('close', () => {
          isConnected = false;
          setConnectionStatus('disconnected', 'Bağlantı Kesildi');
          document.getElementById('triggerSpinBtn').disabled = true;
        });

        conn.on('error', (err) => {
          console.error('Conn error:', err);
          setConnectionStatus('disconnected', 'Hata Oluştu');
        });
      });

      peer.on('error', (err) => {
        console.error('Peer error:', err);
        setConnectionStatus('disconnected', 'Oda Bulunamadı');
      });
    }

    function setConnectionStatus(status, text) {
      const badge = document.getElementById('connBadge');
      const dot = document.getElementById('connDot');
      const statusText = document.getElementById('connStatusText');

      statusText.textContent = text;

      if (status === 'connected') {
        badge.className = 'flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-950/80 border border-emerald-800/60 text-emerald-300';
        dot.className = 'w-2 h-2 rounded-full bg-emerald-500 animate-pulse';
      } else if (status === 'connecting') {
        badge.className = 'flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-amber-950/80 border border-amber-800/60 text-amber-300';
        dot.className = 'w-2 h-2 rounded-full bg-amber-500 animate-ping';
      } else {
        badge.className = 'flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-rose-950/80 border border-rose-800/60 text-rose-300';
        dot.className = 'w-2 h-2 rounded-full bg-rose-500';
      }
    }

    function handleIncomingData(data) {
      if (!data || !data.type) return;

      if (data.type === 'init') {
        if (data.names && data.names.length) {
          // Tahtanın başlangıç isimleri varsa al (eğer bizde henüz liste yoksa)
        }
        setSpinningState(data.isSpinning);
      } else if (data.type === 'spin_start') {
        setSpinningState(true);
      } else if (data.type === 'spin_end') {
        setSpinningState(false);
        showToast('🏆 Kazanan: ' + data.winner);
        // İsteğe bağlı: Hedef vurulduktan sonra hedefi sıfırla
        selectedTarget = null;
        updateTargetUI();
        renderGrid(document.getElementById('searchInput').value);
      }
    }

    function setSpinningState(spinning) {
      isWheelSpinning = spinning;
      const btn = document.getElementById('triggerSpinBtn');
      const text = document.getElementById('triggerBtnText');

      if (spinning) {
        btn.disabled = true;
        text.textContent = 'ÇARK DÖNÜYOR...';
      } else {
        btn.disabled = !isConnected;
        text.textContent = 'ÇARKI UZAKTAN ÇEVİR';
      }
    }

    // Çarkı Tetikle
    document.getElementById('triggerSpinBtn').addEventListener('click', () => {
      if (!isConnected || !conn || !conn.open || isWheelSpinning) return;
      vibrate();
      conn.send({
        type: 'spin',
        target: selectedTarget // null ise rastgele, isim ise hedef
      });
      showToast(selectedTarget ? `🎯 Hedef ile tetiklendi: ${selectedTarget}` : '🎲 Rastgele tetiklendi');
    });

    // Hedefi Sıfırla
    document.getElementById('resetTargetBtn').addEventListener('click', () => {
      vibrate();
      selectedTarget = null;
      updateTargetUI();
      renderGrid(document.getElementById('searchInput').value);
      if (conn && conn.open) {
        conn.send({ type: 'set_target', target: null });
      }
      showToast('Hedef sıfırlandı: Rastgele');
    });

    // Arama Filtresi
    document.getElementById('searchInput').addEventListener('input', (e) => {
      renderGrid(e.target.value);
    });

    // Bağlan Butonu
    document.getElementById('connectBtn').addEventListener('click', initConnection);
    document.getElementById('roomIdInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') initConnection();
    });

    // --- Liste Düzenleyici ---
    const listPanel = document.getElementById('listEditorPanel');
    const textarea = document.getElementById('namesTextarea');

    document.getElementById('toggleListEditorBtn').addEventListener('click', () => {
      textarea.value = names.join('\n');
      listPanel.classList.remove('hidden');
    });

    function closeEditor() {
      listPanel.classList.add('hidden');
    }

    document.getElementById('closeEditorBtn').addEventListener('click', closeEditor);
    document.getElementById('cancelEditorBtn').addEventListener('click', closeEditor);

    document.getElementById('loadDefaultBtn').addEventListener('click', () => {
      textarea.value = DEFAULT_NAMES.join('\n');
    });

    document.getElementById('saveAndSyncBtn').addEventListener('click', () => {
      const parsed = textarea.value
        .split('\n')
        .map(n => n.trim())
        .filter(n => n.length > 0);

      if (parsed.length === 0) {
        showToast('En az 1 isim girmelisiniz!');
        return;
      }

      names = parsed;
      saveNames();
      renderGrid(document.getElementById('searchInput').value);
      closeEditor();

      // Tahtaya senkronize et
      if (conn && conn.open) {
        conn.send({
          type: 'sync_names',
          names: names
        });
        showToast('Liste tahtaya gönderildi (' + names.length + ' kişi)');
      } else {
        showToast('Liste kaydedildi (' + names.length + ' kişi)');
      }
    });

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.remove('opacity-0');
      setTimeout(() => {
        toast.classList.add('opacity-0');
      }, 2400);
    }

    // Sayfa Yüklendiğinde
    window.addEventListener('DOMContentLoaded', () => {
      loadNames();
      renderGrid();
      updateTargetUI();

      // URL parametresi kontrolü (?room=cark-1234)
      const urlParams = new URLSearchParams(window.location.search);
      const roomParam = urlParams.get('room') || localStorage.getItem('cark_last_room');
      if (roomParam) {
        document.getElementById('roomIdInput').value = roomParam;
        // Eğer URL'den doğrudan geldiyse otomatik bağlanmayı dene
        if (urlParams.get('room')) {
          setTimeout(initConnection, 300);
        }
      }
    });
  </script>
</body>
</html>
