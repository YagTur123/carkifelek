<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D Casino & Şans Oyunları</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="https://unpkg.com/mqtt@5.3.5/dist/mqtt.min.js"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    .casino-felt {
      background-color: #050806;
      background-image: radial-gradient(#0e1b12 1px, transparent 1px), radial-gradient(#0e1b12 1px, #050806 1px);
      background-size: 32px 32px;
      background-position: 0 0, 16px 16px;
    }
    .perspective-stage {
      perspective: 1000px;
      transform-style: preserve-3d;
    }
    .wheel-3d {
      transform: rotateX(20deg) scale(0.96);
      box-shadow: 0 35px 55px -15px rgba(0, 0, 0, 0.95), 0 0 30px rgba(212, 175, 55, 0.15);
    }
    .slot-drum-box {
      perspective: 700px;
      transform-style: preserve-3d;
      box-shadow: inset 0 30px 25px -10px rgba(0,0,0,0.95), inset 0 -30px 25px -10px rgba(0,0,0,0.95);
    }
    .card-flipper {
      transition: transform 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform-style: preserve-3d;
    }
    .card-flipped { transform: rotateY(180deg); }
    .card-face {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .card-back { transform: rotateY(180deg); }

    @keyframes screen-shake {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-3px, 3px); }
      40% { transform: translate(3px, -2px); }
      60% { transform: translate(-2px, -3px); }
      80% { transform: translate(2px, 2px); }
    }
    .shake { animation: screen-shake 0.38s both; }
  </style>
</head>
<body id="mainBody" class="casino-felt text-zinc-100 min-h-screen flex flex-col items-center justify-between overflow-hidden select-none font-sans antialiased">

  <!-- Üst Bar -->
  <header class="w-full flex items-center justify-between px-4 md:px-8 py-3.5 z-30 bg-zinc-950/90 border-b border-zinc-800/80 backdrop-blur">
    <div class="flex items-center gap-2.5">
      <div class="w-2.5 h-6 bg-amber-500 rounded-sm"></div>
      <div>
        <h1 class="text-sm md:text-base font-bold tracking-wider text-amber-100 font-serif uppercase truncate max-w-[150px] md:max-w-xs" id="gameTitleDisplay">3D Casino Çarkı</h1>
        <p class="text-[10px] text-zinc-400">Tur: <span id="roundCounter" class="text-amber-400 font-mono font-bold">1</span></p>
      </div>
    </div>

    <!-- 4 Klasik Oyun Seçici Menü -->
    <div class="flex items-center bg-zinc-900 border border-zinc-800 p-1 rounded-lg gap-1.5 text-xs">
      <button onclick="setGameMode('wheel')" id="btnModeWheel" class="px-3.5 py-1.5 rounded bg-amber-500 text-black font-bold whitespace-nowrap transition">Çarkıfelek</button>
      <button onclick="setGameMode('slot')" id="btnModeSlot" class="px-3.5 py-1.5 rounded text-zinc-400 hover:text-white whitespace-nowrap transition">Vegas Slot</button>
      <button onclick="setGameMode('roulette')" id="btnModeRoulette" class="px-3.5 py-1.5 rounded text-zinc-400 hover:text-white whitespace-nowrap transition">Rulet</button>
      <button onclick="setGameMode('cards')" id="btnModeCards" class="px-3.5 py-1.5 rounded text-zinc-400 hover:text-white whitespace-nowrap transition">Kart Masası</button>
    </div>

    <!-- Sağ Kontroller -->
    <div class="flex items-center gap-2">
      <button id="openQrBtn" class="px-2.5 py-1.5 rounded bg-zinc-900 border border-zinc-800 text-xs text-amber-200 hover:text-white transition flex items-center gap-1">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"/></svg>
        <span class="hidden md:inline">Kamera</span>
      </button>
      <button id="toggleHistoryBtn" class="px-2.5 py-1.5 rounded bg-zinc-900 border border-zinc-800 text-xs text-zinc-300">Geçmiş (<span id="historyCount">0</span>)</button>
      <button id="soundToggleBtn" class="p-1.5 rounded bg-zinc-900 border border-zinc-800 text-zinc-400">
        <svg id="soundOnIcon" class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>
        <svg id="soundOffIcon" class="w-4 h-4 hidden text-zinc-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/></svg>
      </button>
    </div>
  </header>

  <!-- OYUN SAHNESİ -->
  <main class="relative flex-1 w-full flex items-center justify-center p-3 perspective-stage">

    <!-- 1. 3D ÇARKIFELEK -->
    <div id="gameWheelView" class="game-view relative flex items-center justify-center">
      <div class="relative wheel-3d transition-all duration-300">
        <div class="absolute -top-7 left-1/2 -translate-x-1/2 z-30 pointer-events-none filter drop-shadow-xl" id="pointerEl">
          <div class="w-8 h-12 bg-gradient-to-b from-amber-200 via-amber-500 to-amber-700" style="clip-path: polygon(50% 100%, 0 0, 100% 0);"></div>
          <div class="w-3.5 h-3.5 rounded-full bg-amber-100 mx-auto -mt-12 border border-amber-950"></div>
        </div>
        <canvas id="wheelCanvas" class="rounded-full cursor-pointer"></canvas>
        <button id="centerSpinBtn" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-20 h-20 md:w-24 md:h-24 rounded-full bg-zinc-950 border-4 border-amber-500 flex flex-col items-center justify-center z-20 transition active:scale-95 hover:border-amber-400 shadow-2xl">
          <span class="text-amber-400 text-xs md:text-sm font-black uppercase tracking-widest font-serif">ÇEVİR</span>
        </button>
      </div>
    </div>

    <!-- 2. 3D VEGAS SLOT MAKİNESİ -->
    <div id="gameSlotView" class="game-view hidden flex flex-col items-center">
      <div class="bg-gradient-to-b from-zinc-900 via-zinc-950 to-black border-4 border-amber-600 rounded-3xl p-6 md:p-8 shadow-2xl flex flex-col items-center gap-6 max-w-lg w-full relative">
        <h2 class="text-amber-300 font-serif font-black text-2xl tracking-widest uppercase drop-shadow">3D VEGAS SLOTS</h2>
        <div class="flex items-center gap-3 bg-black p-4 rounded-2xl border-2 border-amber-700/80 shadow-2xl w-full justify-center">
          <div class="w-28 md:w-32 h-36 bg-zinc-950 border border-zinc-800 rounded-xl overflow-hidden relative slot-drum-box flex items-center justify-center p-2">
            <div id="slotReel1" class="text-center font-black text-sm md:text-base text-amber-200 font-serif truncate w-full transition-transform duration-75">---</div>
          </div>
          <div class="w-28 md:w-32 h-36 bg-zinc-950 border border-zinc-800 rounded-xl overflow-hidden relative slot-drum-box flex items-center justify-center p-2">
            <div id="slotReel2" class="text-center font-black text-sm md:text-base text-amber-200 font-serif truncate w-full transition-transform duration-75">---</div>
          </div>
          <div class="w-28 md:w-32 h-36 bg-zinc-950 border border-zinc-800 rounded-xl overflow-hidden relative slot-drum-box flex items-center justify-center p-2">
            <div id="slotReel3" class="text-center font-black text-sm md:text-base text-amber-200 font-serif truncate w-full transition-transform duration-75">---</div>
          </div>
        </div>
        <button id="slotSpinBtn" class="w-full py-4 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 text-black font-black text-sm uppercase tracking-widest shadow-xl transition active:scale-98">KOLU ÇEK (SPIN)</button>
      </div>
    </div>

    <!-- 3. 3D RULET MASASI -->
    <div id="gameRouletteView" class="game-view hidden flex flex-col items-center gap-4">
      <div class="relative wheel-3d">
        <canvas id="rouletteCanvas" class="rounded-full shadow-2xl border-4 border-amber-700/80"></canvas>
        <button id="rouletteSpinBtn" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-16 h-16 rounded-full bg-zinc-950 border-2 border-amber-500 text-amber-300 font-bold text-xs uppercase hover:border-amber-400 active:scale-95 shadow-xl">Topu At</button>
      </div>
      <div id="rouletteCurrentNumber" class="text-xs text-amber-200/90 bg-zinc-950/90 px-4 py-1.5 rounded-full border border-zinc-800 backdrop-blur">Krupiye bekleniyor...</div>
    </div>

    <!-- 4. 3D GİZEMLİ KART MASASI -->
    <div id="gameCardsView" class="game-view hidden flex flex-col items-center gap-5 w-full">
      <div id="cardsGrid" class="flex flex-wrap items-center justify-center gap-3.5 perspective-stage max-w-2xl max-h-[380px] overflow-y-auto p-2">
      </div>
      <button id="cardsDealBtn" class="px-8 py-3 rounded-xl bg-amber-500 hover:bg-amber-400 text-black font-black text-sm uppercase tracking-wider transition active:scale-95 shadow-xl">KARTLARI DAĞIT VE AÇ</button>
    </div>

  </main>

  <!-- Alt Bar -->
  <footer class="w-full flex items-center justify-between px-6 py-3 bg-zinc-950/90 border-t border-zinc-800/80 backdrop-blur text-xs text-zinc-400 z-30">
    <div>Kalan: <span id="studentCount" class="text-amber-400 font-bold font-mono">0</span> kişi</div>
    <div id="roomBadge" class="flex items-center gap-2 cursor-pointer hover:text-amber-200 transition">
      <span id="statusDot" class="w-2 h-2 rounded-full bg-amber-400"></span>
      <span class="font-mono text-xs" id="roomIdDisplay">Bağlanıyor...</span>
    </div>
  </footer>

  <!-- QR Modal -->
  <div id="qrModal" class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-200 backdrop-blur-sm">
    <div class="bg-zinc-950 border border-amber-500/60 rounded-2xl p-6 max-w-xs w-full text-center shadow-2xl flex flex-col items-center gap-4">
      <h3 class="font-bold text-amber-200 text-sm font-serif">Kamerayla Bağlan</h3>
      <div class="p-3 bg-white rounded-xl shadow-inner">
        <img id="qrImage" src="" alt="QR Kod" class="w-48 h-48 block">
      </div>
      <div class="text-[11px] text-zinc-400 font-mono bg-zinc-900 py-1 px-3 rounded border border-zinc-800 truncate w-full" id="qrRoomCode">Oda: ...</div>
      <button id="closeQrBtn" class="w-full py-2 rounded-lg bg-zinc-800 text-zinc-200 text-xs font-semibold">Kapat</button>
    </div>
  </div>

  <!-- Geçmiş Paneli -->
  <aside id="historyPanel" class="fixed top-0 right-0 bottom-0 w-80 bg-zinc-950/95 border-l border-zinc-800 p-5 z-40 transform translate-x-full transition-transform duration-300 flex flex-col backdrop-blur-md shadow-2xl">
    <div class="flex items-center justify-between border-b border-zinc-800 pb-3 mb-4">
      <h2 class="font-bold text-sm text-amber-200 font-serif">Çekiliş Geçmişi</h2>
      <button id="closeHistoryBtn" class="text-zinc-400 hover:text-white text-xs px-2 py-1 rounded bg-zinc-900 border border-zinc-800">Kapat</button>
    </div>
    <div id="historyList" class="flex-1 overflow-y-auto space-y-2 pr-1"></div>
    <div class="pt-3 border-t border-zinc-800 flex justify-between items-center">
      <button id="clearHistoryBtn" class="text-xs text-zinc-500 hover:text-rose-400 transition">Geçmişi Temizle</button>
      <span class="text-[11px] text-zinc-600" id="totalSpinsCount">Toplam: 0</span>
    </div>
  </aside>

  <!-- Kazanan Pop-up Modalı -->
  <div id="winnerModal" class="fixed inset-0 bg-black/85 z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-200 backdrop-blur-md">
    <div class="bg-gradient-to-b from-zinc-900 via-zinc-950 to-black border-2 border-amber-500/80 rounded-2xl p-6 max-w-sm w-full text-center shadow-2xl transform scale-95 transition-transform" id="winnerCard">
      <p id="winnerGameLabel" class="text-xs text-amber-400/90 font-serif uppercase tracking-widest mb-1">KAZANAN</p>
      <div id="winnerName" class="text-2xl md:text-3xl font-black text-amber-100 tracking-tight my-4 py-3 px-4 bg-zinc-900/90 border border-amber-600/40 rounded-xl font-serif truncate">Kazanan İsim</div>
      <div class="flex flex-col gap-2 mt-5">
        <button id="removeWinnerBtn" class="w-full py-2.5 px-4 rounded-lg bg-amber-500 hover:bg-amber-400 text-black font-bold text-xs uppercase tracking-wider transition">Listeden Çıkar ve Devam Et</button>
        <button id="keepWinnerBtn" class="w-full py-2 px-4 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-xs transition">Listede Tut</button>
      </div>
    </div>
  </div>

  <script>
    let names = [
      "Ahmet", "Ayşe", "Mehmet", "Fatma", "Ali",
      "Zeynep", "Mustafa", "Elif", "Emre", "Burak",
      "Gamze", "Can", "Selin", "Kemal", "Büşra", "Deniz"
    ];

    let history = [];
    let currentWinner = null;
    let round = 1;
    let activeGameMode = 'wheel';
    let isPlaying = false;
    let pendingTarget = null;
    let activeIntervals = [];

    function clearAllIntervals() {
      activeIntervals.forEach(i => clearInterval(i));
      activeIntervals = [];
    }

    // --- SFX Motoru ---
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function playTick(freq = 700) {
      if (!soundEnabled) return;
      initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 0.03);
        gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.005, audioCtx.currentTime + 0.03);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.03);
      } catch (e) {}
    }

    function playWinSound() {
      if (!soundEnabled) return;
      initAudio();
      [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((freq, i) => {
        try {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.15, audioCtx.currentTime + i * 0.09);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.09 + 0.4);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(audioCtx.currentTime + i * 0.09);
          osc.stop(audioCtx.currentTime + i * 0.09 + 0.4);
        } catch (e) {}
      });
    }

    function triggerScreenShake() {
      const body = document.getElementById('mainBody');
      body.classList.remove('shake');
      void body.offsetWidth;
      body.classList.add('shake');
      setTimeout(() => body.classList.remove('shake'), 400);
    }

    // --- OYUN MODU YÖNETİMİ ---
    function setGameMode(mode, broadcastSync = true) {
      if (isPlaying) return;
      clearAllIntervals();
      activeGameMode = mode;
      document.querySelectorAll('.game-view').forEach(el => el.classList.add('hidden'));

      ['wheel', 'slot', 'roulette', 'cards'].forEach(m => {
        const btn = document.getElementById('btnMode' + m.charAt(0).toUpperCase() + m.slice(1));
        if (btn) {
          btn.className = (m === mode) 
            ? 'px-3.5 py-1.5 rounded bg-amber-500 text-black font-bold whitespace-nowrap transition'
            : 'px-3.5 py-1.5 rounded text-zinc-400 hover:text-white whitespace-nowrap transition';
        }
      });

      const titles = {
        wheel: '3D Casino Çarkı', slot: '3D Vegas Slots', roulette: '3D Rulet Masası',
        cards: '3D Gizemli Kart Masası'
      };
      document.getElementById('gameTitleDisplay').textContent = titles[mode] || 'Şans Oyunu';

      const viewEl = document.getElementById('game' + mode.charAt(0).toUpperCase() + mode.slice(1) + 'View');
      if (viewEl) viewEl.classList.remove('hidden');

      if (mode === 'wheel') resizeWheelCanvas();
      else if (mode === 'slot') initSlotDisplay();
      else if (mode === 'roulette') resizeRouletteCanvas();
      else if (mode === 'cards') renderCardsGrid();

      if (broadcastSync) broadcast({ type: 'game_mode_changed', mode: mode });
    }

    // --- 1. 3D ÇARKIFELEK ---
    const wheelCanvas = document.getElementById('wheelCanvas');
    const wheelCtx = wheelCanvas.getContext('2d');
    let wheelRadius = 0, wheelRotation = 0, lastWheelTickIndex = -1;
    const casinoPalette = ['#8f1d1d', '#18201d', '#155234', '#18201d', '#b3822a', '#18201d'];

    function resizeWheelCanvas() {
      const size = Math.min(window.innerWidth * 0.85, window.innerHeight * 0.65, 500);
      const dpr = window.devicePixelRatio || 1;
      wheelCanvas.width = size * dpr;
      wheelCanvas.height = size * dpr;
      wheelCanvas.style.width = size + 'px';
      wheelCanvas.style.height = size + 'px';
      wheelCtx.scale(dpr, dpr);
      wheelRadius = size / 2;
      drawWheel();
    }

    function drawWheel() {
      if (!names.length) return;
      const N = names.length, arc = (2 * Math.PI) / N;
      const cx = wheelRadius, cy = wheelRadius, r = wheelRadius - 12;
      wheelCtx.clearRect(0, 0, wheelRadius * 2, wheelRadius * 2);

      for (let i = 0; i < N; i++) {
        const a = wheelRotation + i * arc;
        wheelCtx.beginPath();
        wheelCtx.fillStyle = casinoPalette[i % casinoPalette.length];
        wheelCtx.moveTo(cx, cy);
        wheelCtx.arc(cx, cy, r, a, a + arc);
        wheelCtx.fill();
        wheelCtx.strokeStyle = '#d4af37';
        wheelCtx.lineWidth = 1.5;
        wheelCtx.stroke();

        wheelCtx.save();
        wheelCtx.translate(cx, cy);
        wheelCtx.rotate(a + arc / 2);
        wheelCtx.textAlign = 'right';
        wheelCtx.fillStyle = '#fef3c7';
        const fontSize = Math.max(10, Math.min(14, Math.floor(wheelRadius / 17)));
        wheelCtx.font = `bold ${fontSize}px sans-serif`;
        let displayName = names[i];
        if (displayName.length > 12) displayName = displayName.substring(0, 11) + '…';
        wheelCtx.fillText(displayName, r - 20, fontSize / 3);
        wheelCtx.restore();
      }

      wheelCtx.beginPath();
      wheelCtx.arc(cx, cy, r + 5, 0, 2 * Math.PI);
      wheelCtx.strokeStyle = '#272017';
      wheelCtx.lineWidth = 12;
      wheelCtx.stroke();

      wheelCtx.beginPath();
      wheelCtx.arc(cx, cy, r + 10, 0, 2 * Math.PI);
      wheelCtx.strokeStyle = '#b48a3c';
      wheelCtx.lineWidth = 2;
      wheelCtx.stroke();
    }

    function spinWheel(targetName = null) {
      if (isPlaying || !names.length) return;
      isPlaying = true;
      broadcast({ type: 'spin_start' });

      const N = names.length, arc = (2 * Math.PI) / N;
      let targetIndex = targetName ? names.findIndex(n => n.trim().toLowerCase() === targetName.trim().toLowerCase()) : -1;
      const totalTurns = (6 + Math.floor(Math.random() * 3)) * 2 * Math.PI;
      let deltaRotation = 0;
      const POINTER_ANGLE = 1.5 * Math.PI;

      if (targetIndex !== -1) {
        const randInside = targetIndex * arc + (0.2 + Math.random() * 0.6) * arc;
        const desiredMod = ((POINTER_ANGLE - randInside) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
        const currentMod = (wheelRotation % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
        let diff = desiredMod - currentMod;
        if (diff < 0) diff += 2 * Math.PI;
        deltaRotation = totalTurns + diff;
      } else {
        deltaRotation = totalTurns + Math.random() * 2 * Math.PI;
      }

      const startRot = wheelRotation, finalRot = startRot + deltaRotation;
      const duration = 5000, startTime = performance.now();
      const pointerEl = document.getElementById('pointerEl');

      function anim(time) {
        const elapsed = time - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const ease = 1 - Math.pow(1 - progress, 5);
        wheelRotation = startRot + deltaRotation * ease;
        drawWheel();

        const curIdx = Math.floor(((POINTER_ANGLE - wheelRotation) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) / arc) % N;
        if (curIdx !== lastWheelTickIndex) {
          playTick(750);
          lastWheelTickIndex = curIdx;
          pointerEl.style.transform = 'translateX(-50%) rotate(-15deg)';
          setTimeout(() => pointerEl.style.transform = 'translateX(-50%) rotate(0deg)', 40);
        }

        if (progress < 1) requestAnimationFrame(anim);
        else {
          isPlaying = false;
          wheelRotation = finalRot;
          drawWheel();
          const winnerIdx = Math.floor(((POINTER_ANGLE - wheelRotation) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) / arc) % N;
          finishGame(names[winnerIdx], targetName !== null, '3D Çarkıfelek');
        }
      }
      requestAnimationFrame(anim);
    }

    // --- 2. 3D VEGAS SLOT ---
    function initSlotDisplay() {
      if (!names.length) return;
      document.getElementById('slotReel1').textContent = names[0];
      document.getElementById('slotReel2').textContent = names[Math.min(1, names.length - 1)];
      document.getElementById('slotReel3').textContent = names[Math.min(2, names.length - 1)];
    }

    function spinSlot(targetName = null) {
      if (isPlaying || !names.length) return;
      isPlaying = true;
      broadcast({ type: 'spin_start' });

      let target = targetName || names[Math.floor(Math.random() * names.length)];
      const r1 = document.getElementById('slotReel1');
      const r2 = document.getElementById('slotReel2');
      const r3 = document.getElementById('slotReel3');

      let i1 = setInterval(() => { r1.textContent = names[Math.floor(Math.random() * names.length)]; playTick(550); }, 55);
      let i2 = setInterval(() => { r2.textContent = names[Math.floor(Math.random() * names.length)]; }, 55);
      let i3 = setInterval(() => { r3.textContent = names[Math.floor(Math.random() * names.length)]; }, 55);
      activeIntervals.push(i1, i2, i3);

      function lock(el, val) {
        el.textContent = val;
        el.style.transform = 'translateY(12px)';
        setTimeout(() => el.style.transform = 'translateY(0px)', 120);
      }

      setTimeout(() => { clearInterval(i1); lock(r1, target); playTick(900); }, 2000);
      setTimeout(() => { clearInterval(i2); lock(r2, target); playTick(950); }, 2900);
      setTimeout(() => {
        clearInterval(i3);
        lock(r3, target);
        playTick(1100);
        isPlaying = false;
        finishGame(target, targetName !== null, '3D Vegas Slots');
      }, 3800);
    }

    // --- 3. 3D RULET MASASI ---
    const rouletteCanvas = document.getElementById('rouletteCanvas');
    const rouletteCtx = rouletteCanvas.getContext('2d');
    let rouletteRadius = 0, rouletteAngle = 0, ballAngle = 0;

    function resizeRouletteCanvas() {
      const size = Math.min(window.innerWidth * 0.85, window.innerHeight * 0.55, 420);
      const dpr = window.devicePixelRatio || 1;
      rouletteCanvas.width = size * dpr;
      rouletteCanvas.height = size * dpr;
      rouletteCanvas.style.width = size + 'px';
      rouletteCanvas.style.height = size + 'px';
      rouletteCtx.scale(dpr, dpr);
      rouletteRadius = size / 2;
      drawRoulette();
    }

    function drawRoulette(ballDist = null) {
      if (!names.length) return;
      const N = names.length, arc = (2 * Math.PI) / N;
      const cx = rouletteRadius, cy = rouletteRadius, r = rouletteRadius - 10;
      rouletteCtx.clearRect(0, 0, rouletteRadius * 2, rouletteRadius * 2);

      for (let i = 0; i < N; i++) {
        const a = rouletteAngle + i * arc;
        rouletteCtx.beginPath();
        rouletteCtx.fillStyle = (i % 2 === 0) ? '#8f1d1d' : '#141414';
        rouletteCtx.moveTo(cx, cy);
        rouletteCtx.arc(cx, cy, r, a, a + arc);
        rouletteCtx.fill();
        rouletteCtx.strokeStyle = '#d4af37';
        rouletteCtx.stroke();

        rouletteCtx.save();
        rouletteCtx.translate(cx, cy);
        rouletteCtx.rotate(a + arc / 2);
        rouletteCtx.textAlign = 'right';
        rouletteCtx.fillStyle = '#fef3c7';
        rouletteCtx.font = 'bold 10px sans-serif';
        let displayName = names[i];
        if (displayName.length > 9) displayName = displayName.substring(0, 8) + '…';
        rouletteCtx.fillText(displayName, r - 14, 3);
        rouletteCtx.restore();
      }

      rouletteCtx.beginPath();
      rouletteCtx.arc(cx, cy, r * 0.42, 0, 2 * Math.PI);
      rouletteCtx.fillStyle = '#1c1917';
      rouletteCtx.fill();
      rouletteCtx.strokeStyle = '#d4af37';
      rouletteCtx.lineWidth = 3;
      rouletteCtx.stroke();

      if (ballDist !== null) {
        const bx = cx + ballDist * Math.cos(ballAngle);
        const by = cy + ballDist * Math.sin(ballAngle);
        rouletteCtx.beginPath();
        rouletteCtx.arc(bx, by, 5, 0, 2 * Math.PI);
        rouletteCtx.fillStyle = '#ffffff';
        rouletteCtx.fill();
      }
    }

    function spinRoulette(targetName = null) {
      if (isPlaying || !names.length) return;
      isPlaying = true;
      broadcast({ type: 'spin_start' });

      let targetIndex = targetName ? names.findIndex(n => n.trim().toLowerCase() === targetName.trim().toLowerCase()) : -1;
      if (targetIndex === -1) targetIndex = Math.floor(Math.random() * names.length);

      const N = names.length, arc = (2 * Math.PI) / N;
      const r = rouletteRadius - 10, duration = 5200, startTime = performance.now();

      function anim(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const ease = 1 - Math.pow(1 - progress, 3);

        rouletteAngle = (rouletteAngle + 0.04 * (1 - progress * 0.7)) % (2 * Math.PI);
        ballAngle = (ballAngle - 0.14 * (1 - ease * 0.9)) % (2 * Math.PI);

        const ballDist = (r - 18) - (progress > 0.65 ? (progress - 0.65) * 45 : 0);
        drawRoulette(ballDist);

        if (Math.random() < 0.2) playTick(850);

        if (progress < 1) {
          requestAnimationFrame(anim);
        } else {
          isPlaying = false;
          ballAngle = rouletteAngle + targetIndex * arc + arc / 2;
          drawRoulette(r - 35);
          finishGame(names[targetIndex], targetName !== null, '3D Rulet');
        }
      }
      requestAnimationFrame(anim);
    }

    // --- 4. 3D GİZEMLİ KART MASASI ---
    function renderCardsGrid() {
      const grid = document.getElementById('cardsGrid');
      grid.innerHTML = '';
      const displayCount = Math.min(names.length, 12);
      for (let i = 0; i < displayCount; i++) {
        const card = document.createElement('div');
        card.className = 'w-20 md:w-24 h-28 md:h-32 relative cursor-pointer card-flipper';
        card.id = 'cardItem_' + i;
        card.innerHTML = `
          <div class="absolute inset-0 rounded-xl bg-gradient-to-br from-red-950 to-zinc-950 border-2 border-amber-600 flex items-center justify-center card-face shadow-lg">
            <span class="text-2xl text-amber-500 font-serif">♠</span>
          </div>
          <div class="absolute inset-0 rounded-xl bg-gradient-to-tr from-zinc-900 to-zinc-950 border-2 border-amber-400 flex flex-col items-center justify-center card-face card-back p-1.5 shadow-2xl">
            <span class="text-[10px] text-amber-400 font-serif">KAZANAN</span>
            <span class="text-xs font-bold text-white text-center mt-1 truncate w-full">${names[i]}</span>
          </div>
        `;
        grid.appendChild(card);
      }
    }

    function dealCards(targetName = null) {
      if (isPlaying || !names.length) return;
      isPlaying = true;
      broadcast({ type: 'spin_start' });
      playTick(600);

      const maxCards = Math.min(names.length, 12);
      let target = targetName;
      let targetIdx = -1;

      if (target) {
        targetIdx = names.findIndex(n => n.trim().toLowerCase() === target.trim().toLowerCase());
        if (targetIdx >= maxCards) targetIdx = 0;
      }
      if (targetIdx === -1) {
        targetIdx = Math.floor(Math.random() * maxCards);
        target = names[targetIdx];
      }

      document.querySelectorAll('.card-flipper').forEach(c => c.classList.remove('card-flipped'));

      setTimeout(() => {
        const targetCard = document.getElementById('cardItem_' + targetIdx);
        if (targetCard) targetCard.classList.add('card-flipped');
        playTick(1000);
        setTimeout(() => {
          isPlaying = false;
          finishGame(target, targetName !== null, '3D Gizemli Kart');
        }, 1100);
      }, 900);
    }

    // --- GENEL TETİKLEME ---
    function triggerGame(target = null) {
      if (activeGameMode === 'wheel') spinWheel(target);
      else if (activeGameMode === 'slot') spinSlot(target);
      else if (activeGameMode === 'roulette') spinRoulette(target);
      else if (activeGameMode === 'cards') dealCards(target);
    }

    function finishGame(winner, wasTargeted, gameLabel) {
      currentWinner = winner;
      addHistoryRecord(winner, round, wasTargeted, gameLabel);
      round++;
      updateRoundUI();

      triggerScreenShake();
      playWinSound();
      triggerCelebration(winner, gameLabel);

      broadcast({
        type: 'spin_end',
        winner: winner,
        history: history,
        names: names
      });
    }

    function triggerCelebration(winner, gameLabel) {
      try { confetti({ particleCount: 110, spread: 80, origin: { y: 0.6 } }); } catch (e) {}
      document.getElementById('winnerName').textContent = winner;
      document.getElementById('winnerGameLabel').textContent = gameLabel || 'KAZANAN';
      const modal = document.getElementById('winnerModal');
      const card = document.getElementById('winnerCard');
      modal.classList.remove('opacity-0', 'pointer-events-none');
      card.classList.remove('scale-95');
      card.classList.add('scale-100');
    }

    function addHistoryRecord(winner, roundNumber, wasTargeted, gameLabel) {
      const timeStr = new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      history.unshift({ round: roundNumber, winner: winner, time: timeStr, wasTargeted: wasTargeted, game: gameLabel });
      saveStorage();
      renderHistoryUI();
    }

    function renderHistoryUI() {
      const list = document.getElementById('historyList');
      document.getElementById('historyCount').textContent = history.length;
      document.getElementById('totalSpinsCount').textContent = 'Toplam: ' + history.length;
      if (!history.length) {
        list.innerHTML = `<div class="text-center py-8 text-xs text-zinc-600">Henüz çekiliş yapılmadı.</div>`;
        return;
      }
      list.innerHTML = history.map(item => `
        <div class="flex items-center justify-between p-2.5 rounded bg-zinc-900 border border-zinc-800 text-xs">
          <div>
            <div class="flex items-center gap-2">
              <span class="text-amber-500 font-mono font-bold">#${item.round}</span>
              <span class="text-zinc-200 font-semibold">${item.winner}</span>
            </div>
            <div class="text-[10px] text-zinc-500">${item.game || 'Oyun'}</div>
          </div>
          <span class="text-[10px] text-zinc-500 font-mono">${item.time}</span>
        </div>
      `).join('');
    }

    function updateRoundUI() {
      document.getElementById('roundCounter').textContent = round;
      document.getElementById('studentCount').textContent = names.length;
    }

    function loadStorage() {
      try {
        const sNames = localStorage.getItem('cark_names');
        if (sNames) names = JSON.parse(sNames);
        const sHist = localStorage.getItem('cark_history');
        if (sHist) { history = JSON.parse(sHist); round = history.length + 1; }
      } catch (e) {}
      updateRoundUI();
      renderHistoryUI();
    }

    function saveStorage() {
      try {
        localStorage.setItem('cark_names', JSON.stringify(names));
        localStorage.setItem('cark_history', JSON.stringify(history));
      } catch (e) {}
    }

    function closeModal() {
      document.getElementById('winnerModal').classList.add('opacity-0', 'pointer-events-none');
    }

    function removeCurrentWinner() {
      if (currentWinner) {
        names = names.filter(n => n !== currentWinner);
        saveStorage();
        updateRoundUI();
        if (activeGameMode === 'wheel') drawWheel();
        else if (activeGameMode === 'cards') renderCardsGrid();
        broadcast({ type: 'sync_names', names: names });
      }
      closeModal();
    }

    document.getElementById('removeWinnerBtn').addEventListener('click', removeCurrentWinner);
    document.getElementById('keepWinnerBtn').addEventListener('click', closeModal);
    document.getElementById('winnerModal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('winnerModal')) closeModal();
    });

    document.getElementById('centerSpinBtn').addEventListener('click', () => { triggerGame(pendingTarget); pendingTarget = null; });
    document.getElementById('slotSpinBtn').addEventListener('click', () => { triggerGame(pendingTarget); pendingTarget = null; });
    document.getElementById('rouletteSpinBtn').addEventListener('click', () => { triggerGame(pendingTarget); pendingTarget = null; });
    document.getElementById('cardsDealBtn').addEventListener('click', () => { triggerGame(pendingTarget); pendingTarget = null; });

    document.getElementById('toggleHistoryBtn').addEventListener('click', () => document.getElementById('historyPanel').classList.remove('translate-x-full'));
    document.getElementById('closeHistoryBtn').addEventListener('click', () => document.getElementById('historyPanel').classList.add('translate-x-full'));
    document.getElementById('clearHistoryBtn').addEventListener('click', () => {
      if (confirm('Geçmişi sıfırlamak istiyor musunuz?')) {
        history = []; round = 1; saveStorage(); renderHistoryUI(); updateRoundUI();
      }
    });

    function showQrModal() {
      try {
        const urlObj = new URL(window.location.href);
        urlObj.pathname = urlObj.pathname.replace('index.html', 'control.html');
        urlObj.searchParams.set('room', roomId);
        const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(urlObj.toString())}&bgcolor=ffffff&color=000000`;
        document.getElementById('qrImage').src = qrUrl;
        document.getElementById('qrRoomCode').textContent = 'Oda: ' + roomId;
        document.getElementById('qrModal').classList.remove('opacity-0', 'pointer-events-none');
      } catch (e) {}
    }
    document.getElementById('openQrBtn').addEventListener('click', showQrModal);
    document.getElementById('roomBadge').addEventListener('click', showQrModal);
    document.getElementById('closeQrBtn').addEventListener('click', () => document.getElementById('qrModal').classList.add('opacity-0', 'pointer-events-none'));

    document.getElementById('soundToggleBtn').addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      document.getElementById('soundOnIcon').classList.toggle('hidden', !soundEnabled);
      document.getElementById('soundOffIcon').classList.toggle('hidden', soundEnabled);
    });

    // --- PeerJS & MQTT ---
    let peer = null, connections = [], mqttClient = null, heartbeatInterval = null;
    const randomCode = Math.floor(1000 + Math.random() * 9000);
    const roomId = 'cark-' + randomCode;

    function initLobbyBroadcast() {
      try {
        mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
          clientId: 'host_' + roomId + '_' + Math.random().toString(16).substring(2, 8),
          clean: true, connectTimeout: 4000
        });
        mqttClient.on('connect', () => {
          sendHeartbeat();
          if (heartbeatInterval) clearInterval(heartbeatInterval);
          heartbeatInterval = setInterval(sendHeartbeat, 3000);
        });
      } catch (e) {}
    }

    function sendHeartbeat() {
      if (mqttClient && mqttClient.connected) {
        mqttClient.publish('carkifelek_public_rooms', JSON.stringify({
          roomId: roomId,
          title: 'Casino Masası #' + randomCode,
          gameMode: activeGameMode,
          studentCount: names.length,
          lastSeen: Date.now()
        }));
      }
    }

    function initPeer() {
      peer = new Peer(roomId);
      peer.on('open', (id) => {
        document.getElementById('roomIdDisplay').textContent = id;
        document.getElementById('statusDot').className = 'w-2 h-2 rounded-full bg-emerald-400';
        initLobbyBroadcast();
      });

      peer.on('connection', (conn) => {
        connections.push(conn);
        conn.on('open', () => {
          conn.send({
            type: 'init',
            names: names,
            history: history,
            gameMode: activeGameMode,
            isSpinning: isPlaying
          });
        });

        conn.on('data', (data) => {
          if (!data || !data.type) return;
          if (data.type === 'sync_names') {
            if (Array.isArray(data.names) && data.names.length) {
              names = data.names;
              saveStorage();
              updateRoundUI();
              if (activeGameMode === 'wheel') drawWheel();
              else if (activeGameMode === 'cards') renderCardsGrid();
            }
          } else if (data.type === 'spin') {
            closeModal();
            if (data.mode && data.mode !== activeGameMode) {
              setGameMode(data.mode, false);
            }
            let validTarget = data.target;
            if (validTarget && !names.some(n => n.trim().toLowerCase() === validTarget.trim().toLowerCase())) {
              validTarget = null;
            }
            triggerGame(validTarget);
          } else if (data.type === 'set_target') {
            let validTarget = data.target;
            if (validTarget && !names.some(n => n.trim().toLowerCase() === validTarget.trim().toLowerCase())) {
              validTarget = null;
            }
            pendingTarget = validTarget;
          } else if (data.type === 'set_game_mode') {
            setGameMode(data.mode, false);
          } else if (data.type === 'remove_name') {
            names = names.filter(n => n !== data.name);
            if (names.length === 0) names = ["Ahmet", "Ayşe", "Mehmet"];
            saveStorage();
            updateRoundUI();
            if (activeGameMode === 'wheel') drawWheel();
            else if (activeGameMode === 'cards') renderCardsGrid();
          }
        });

        conn.on('close', () => { connections = connections.filter(c => c !== conn); });
      });
    }

    function broadcast(data) {
      connections.forEach(conn => {
        if (conn && conn.open) try { conn.send(data); } catch (e) {}
      });
    }

    window.addEventListener('resize', () => {
      if (activeGameMode === 'wheel') resizeWheelCanvas();
      else if (activeGameMode === 'roulette') resizeRouletteCanvas();
    });

    window.addEventListener('DOMContentLoaded', () => {
      loadStorage();
      setGameMode('wheel', false);
      initPeer();
    });
  </script>
</body>
</html>
