<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sınıf Çarkı</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col items-center justify-center overflow-hidden select-none font-sans antialiased">

  <!-- Üst Bar -->
  <header class="absolute top-5 left-0 right-0 flex items-center justify-between px-6 md:px-8 z-10">
    <div>
      <h1 class="text-lg md:text-xl font-semibold text-white tracking-tight">Sınıf Çarkı</h1>
      <p class="text-xs text-zinc-500">Rastgele Öğrenci Seçici</p>
    </div>

    <!-- Ses ve Tam Ekran Kontrolleri -->
    <div class="flex items-center gap-2">
      <button id="soundToggleBtn" title="Sesi Aç/Kapat" class="p-2 rounded-lg bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-white transition">
        <svg id="soundOnIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>
        <svg id="soundOffIcon" class="w-4 h-4 hidden text-zinc-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/></svg>
      </button>
      <button id="fullscreenBtn" title="Tam Ekran" class="p-2 rounded-lg bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-white transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-5h-4m4 0v4m0-4l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
      </button>
    </div>
  </header>

  <!-- Çark Alanı -->
  <main class="relative flex items-center justify-center p-4 my-auto">
    <div class="relative">
      <!-- Pointer (Ok) - Sade Üçgen Mandal -->
      <div class="absolute -top-5 left-1/2 -translate-x-1/2 z-20 pointer-events-none transition-transform duration-75" id="pointerEl">
        <div class="w-6 h-8 bg-amber-500 rounded-t-sm" style="clip-path: polygon(50% 100%, 0 0, 100% 0);"></div>
      </div>

      <!-- Çark Kanvası -->
      <canvas id="wheelCanvas" class="rounded-full border border-zinc-800 cursor-pointer shadow-lg"></canvas>

      <!-- Çark Merkez Göbeği -->
      <button id="centerSpinBtn" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-20 h-20 rounded-full bg-zinc-900 border-2 border-zinc-700 flex flex-col items-center justify-center z-10 transition active:scale-95 hover:border-amber-500">
        <span class="text-white text-xs font-bold uppercase tracking-wide">Çevir</span>
      </button>
    </div>
  </main>

  <!-- Sağ Alt: Minik Oda Kodu -->
  <footer class="absolute bottom-4 right-4 z-10">
    <div id="roomBadge" title="Bağlantı Kodunu Kopyala" class="flex items-center gap-2 px-2.5 py-1 rounded-md bg-zinc-900 border border-zinc-800 text-xs text-zinc-400 hover:text-zinc-200 transition cursor-pointer">
      <span id="statusDot" class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
      <span class="font-mono text-[11px]" id="roomIdDisplay">Bağlanıyor...</span>
    </div>
  </footer>

  <!-- Sol Alt: Öğrenci Sayacı -->
  <div class="absolute bottom-4 left-4 z-10 text-xs text-zinc-500">
    Kayıtlı: <span id="studentCount" class="text-zinc-300 font-medium">0</span>
  </div>

  <!-- Kazanan Pop-up Modalı (Yalın & Odaklı) -->
  <div id="winnerModal" class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-200">
    <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-6 max-w-sm w-full text-center shadow-xl" id="modalCard">
      <p class="text-xs text-zinc-400 mb-1">Seçilen Öğrenci</p>
      <div id="winnerName" class="text-2xl font-bold text-white tracking-tight my-4 py-2 px-3 bg-zinc-950 border border-zinc-800 rounded-lg">
        Kazanan İsim
      </div>
      <button id="closeModalBtn" class="w-full py-2.5 px-4 rounded-lg bg-zinc-100 hover:bg-white text-zinc-900 font-semibold text-sm transition">
        Tamam
      </button>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-12 right-4 bg-zinc-900 border border-zinc-800 text-zinc-200 text-xs px-3 py-1.5 rounded-md shadow-md opacity-0 transition-opacity pointer-events-none z-50">
    Kopyalandı
  </div>

  <script>
    let names = [
      "Ahmet", "Ayşe", "Mehmet", "Fatma", "Ali",
      "Zeynep", "Mustafa", "Elif", "Emre", "Burak",
      "Gamze", "Can", "Selin", "Kemal", "Büşra", "Deniz"
    ];

    // Dengeli, net ve göz yormayan dilim renkleri
    const sliceColors = [
      '#4f46e5', '#db2777', '#7c3aed', '#0d9488', '#d97706',
      '#2563eb', '#059669', '#e11d48', '#0891b2', '#65a30d',
      '#9333ea', '#c026d3', '#0284c7', '#ca8a04', '#16a34a', '#dc2626'
    ];

    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    let wheelRadius = 0;
    let currentRotation = 0;
    let isSpinning = false;
    let pendingTarget = null;

    let audioCtx = null;
    let soundEnabled = true;
    let lastTickIndex = -1;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playTick() {
      if (!soundEnabled) return;
      try {
        initAudio();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(500, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.03);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.03);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.03);
      } catch (e) {}
    }

    function resizeCanvas() {
      const size = Math.min(window.innerWidth * 0.88, window.innerHeight * 0.72, 560);
      const dpr = window.devicePixelRatio || 1;
      canvas.width = size * dpr;
      canvas.height = size * dpr;
      canvas.style.width = size + 'px';
      canvas.style.height = size + 'px';
      ctx.scale(dpr, dpr);
      wheelRadius = size / 2;
      drawWheel();
    }

    function drawWheel() {
      if (!names.length) return;
      const N = names.length;
      const arc = (2 * Math.PI) / N;
      const cx = wheelRadius;
      const cy = wheelRadius;
      const r = wheelRadius - 4;

      ctx.clearRect(0, 0, wheelRadius * 2, wheelRadius * 2);

      for (let i = 0; i < N; i++) {
        const angle = currentRotation + i * arc;
        const color = sliceColors[i % sliceColors.length];

        ctx.beginPath();
        ctx.fillStyle = color;
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, r, angle, angle + arc);
        ctx.lineTo(cx, cy);
        ctx.fill();

        ctx.strokeStyle = '#09090b';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(angle + arc / 2);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#ffffff';

        const fontSize = Math.max(11, Math.min(16, Math.floor(wheelRadius / 16)));
        ctx.font = `600 ${fontSize}px system-ui, -apple-system, sans-serif`;
        
        let displayName = names[i];
        if (displayName.length > 12) displayName = displayName.substring(0, 11) + '…';
        ctx.fillText(displayName, r - 20, fontSize / 3);
        ctx.restore();
      }

      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, 2 * Math.PI);
      ctx.strokeStyle = '#27272a';
      ctx.lineWidth = 4;
      ctx.stroke();
    }

    const POINTER_ANGLE = 1.5 * Math.PI;

    function getCurrentWinningIndex(rotation) {
      const N = names.length;
      const arc = (2 * Math.PI) / N;
      const norm = ((POINTER_ANGLE - rotation) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
      return Math.floor(norm / arc) % N;
    }

    function spinWheel(targetName = null) {
      if (isSpinning || names.length === 0) return;
      isSpinning = true;
      document.getElementById('centerSpinBtn').disabled = true;

      broadcast({ type: 'spin_start' });

      const N = names.length;
      const arc = (2 * Math.PI) / N;

      let targetIndex = -1;
      if (targetName) {
        targetIndex = names.findIndex(n => n.trim().toLowerCase() === targetName.trim().toLowerCase());
      }

      let deltaRotation = 0;
      const minFullSpins = 5;
      const extraSpins = Math.floor(Math.random() * 3);
      const totalTurns = (minFullSpins + extraSpins) * 2 * Math.PI;

      if (targetIndex !== -1) {
        const randRatio = 0.2 + Math.random() * 0.6;
        const targetPointInsideSlice = targetIndex * arc + randRatio * arc;
        const desiredMod = ((POINTER_ANGLE - targetPointInsideSlice) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
        const currentMod = ((currentRotation) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
        let diff = desiredMod - currentMod;
        if (diff < 0) diff += 2 * Math.PI;
        deltaRotation = totalTurns + diff;
      } else {
        const randomExtraAngle = Math.random() * 2 * Math.PI;
        deltaRotation = totalTurns + randomExtraAngle;
      }

      const startRotation = currentRotation;
      const finalRotation = startRotation + deltaRotation;
      const duration = 4800 + Math.random() * 600;
      const startTime = performance.now();
      const pointerEl = document.getElementById('pointerEl');

      function animate(time) {
        const elapsed = time - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const ease = 1 - Math.pow(1 - progress, 5);

        currentRotation = startRotation + deltaRotation * ease;
        drawWheel();

        const currentIndex = getCurrentWinningIndex(currentRotation);
        if (currentIndex !== lastTickIndex) {
          playTick();
          lastTickIndex = currentIndex;
          pointerEl.style.transform = 'translateX(-50%) rotate(-10deg)';
          setTimeout(() => {
            pointerEl.style.transform = 'translateX(-50%) rotate(0deg)';
          }, 40);
        }

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          isSpinning = false;
          document.getElementById('centerSpinBtn').disabled = false;
          currentRotation = finalRotation;
          drawWheel();

          const winnerIdx = getCurrentWinningIndex(currentRotation);
          const winner = names[winnerIdx];

          triggerCelebration(winner);
          broadcast({ type: 'spin_end', winner: winner });
        }
      }

      requestAnimationFrame(animate);
    }

    function triggerCelebration(winner) {
      try {
        confetti({
          particleCount: 80,
          spread: 70,
          origin: { y: 0.6 }
        });
      } catch (e) {}

      document.getElementById('winnerName').textContent = winner;
      const modal = document.getElementById('winnerModal');
      modal.classList.remove('opacity-0', 'pointer-events-none');
    }

    function closeModal() {
      const modal = document.getElementById('winnerModal');
      modal.classList.add('opacity-0', 'pointer-events-none');
    }

    document.getElementById('closeModalBtn').addEventListener('click', closeModal);
    document.getElementById('winnerModal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('winnerModal')) closeModal();
    });

    document.getElementById('soundToggleBtn').addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      document.getElementById('soundOnIcon').classList.toggle('hidden', !soundEnabled);
      document.getElementById('soundOffIcon').classList.toggle('hidden', soundEnabled);
    });

    document.getElementById('fullscreenBtn').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    document.getElementById('centerSpinBtn').addEventListener('click', () => {
      initAudio();
      spinWheel(pendingTarget);
      pendingTarget = null;
    });

    canvas.addEventListener('click', () => {
      initAudio();
      spinWheel(pendingTarget);
      pendingTarget = null;
    });

    function updateStudentCount() {
      document.getElementById('studentCount').textContent = names.length;
    }

    let peer = null;
    let connections = [];
    const randomCode = Math.floor(1000 + Math.random() * 9000);
    const roomId = 'cark-' + randomCode;

    function initPeer() {
      peer = new Peer(roomId);

      peer.on('open', (id) => {
        document.getElementById('roomIdDisplay').textContent = id;
        document.getElementById('statusDot').className = 'w-1.5 h-1.5 rounded-full bg-emerald-400';
      });

      peer.on('connection', (conn) => {
        connections.push(conn);
        conn.on('open', () => {
          conn.send({
            type: 'init',
            names: names,
            isSpinning: isSpinning
          });
        });

        conn.on('data', (data) => {
          handleIncomingMessage(data, conn);
        });

        conn.on('close', () => {
          connections = connections.filter(c => c !== conn);
        });
      });

      peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
          const fallbackId = 'cark-' + Math.floor(1000 + Math.random() * 9000);
          peer = new Peer(fallbackId);
          peer.on('open', (newId) => {
            document.getElementById('roomIdDisplay').textContent = newId;
            document.getElementById('statusDot').className = 'w-1.5 h-1.5 rounded-full bg-emerald-400';
          });
        }
      });
    }

    function handleIncomingMessage(msg) {
      if (!msg || !msg.type) return;

      if (msg.type === 'sync_names') {
        if (Array.isArray(msg.names) && msg.names.length > 0) {
          names = msg.names;
          updateStudentCount();
          drawWheel();
          broadcast({ type: 'names_updated', names: names });
        }
      } else if (msg.type === 'spin') {
        closeModal();
        spinWheel(msg.target || null);
      } else if (msg.type === 'set_target') {
        pendingTarget = msg.target || null;
      }
    }

    function broadcast(data) {
      connections.forEach(conn => {
        if (conn && conn.open) {
          try { conn.send(data); } catch (e) {}
        }
      });
    }

    document.getElementById('roomBadge').addEventListener('click', () => {
      const idText = document.getElementById('roomIdDisplay').textContent;
      if (idText && idText !== 'Bağlanıyor...') {
        navigator.clipboard.writeText(idText).then(() => {
          showToast('Kopyalandı: ' + idText);
        }).catch(() => {
          showToast(idText);
        });
      }
    });

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.remove('opacity-0');
      setTimeout(() => {
        toast.classList.add('opacity-0');
      }, 2000);
    }

    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('DOMContentLoaded', () => {
      updateStudentCount();
      resizeCanvas();
      initPeer();
    });
  </script>
</body>
</html>
