<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D Vegas Casino & Şans Oyunları</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://unpkg.com/mqtt@5.3.5/dist/mqtt.min.js"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    .casino-felt {
      background-color: #040805;
      background-image: 
        radial-gradient(#0d2215 1px, transparent 1px), 
        radial-gradient(#0d2215 1px, #040805 1px);
      background-size: 32px 32px;
      background-position: 0 0, 16px 16px;
    }
    .perspective-stage {
      perspective: 1200px;
      transform-style: preserve-3d;
    }

    /* 3D Çark Derinliği */
    .wheel-3d {
      transform: rotateX(22deg) scale(0.96);
      box-shadow: 0 45px 65px -15px rgba(0, 0, 0, 0.95), 0 0 45px rgba(212, 175, 55, 0.2);
    }

    /* 3D Rulet Çanağı (Tam Yukarıdan Bakış - Top Down View) */
    .roulette-stage-3d {
      transform: rotateX(0deg) scale(1);
      transition: transform 0.6s cubic-bezier(0.2, 0.85, 0.25, 1);
    }
    .roulette-stage-3d.roulette-spinning-cam {
      transform: scale(1.02);
    }
    .roulette-stage-3d.roulette-zoom-winner {
      transform: scale(1.06);
    }
    .roulette-cylinder-skirt {
      box-shadow: 
        0 0 0 6px #1a0d06,
        0 0 0 10px #d4af37,
        0 0 0 20px #2b170c,
        0 0 0 24px #120904,
        0 25px 65px 25px rgba(0, 0, 0, 0.95),
        0 0 50px rgba(212, 175, 55, 0.25);
      border-radius: 50%;
    }

    /* 3D Slot Kavisli Silindir Derinliği */
    .slot-machine-cabinet {
      background: linear-gradient(180deg, #1f1b14 0%, #0d0a06 100%);
      box-shadow: 0 30px 60px rgba(0,0,0,0.9), inset 0 2px 3px rgba(254, 240, 138, 0.3);
    }
    .slot-reel-viewport {
      perspective: 600px;
      box-shadow: inset 0 35px 30px -10px rgba(0,0,0,0.95), inset 0 -35px 30px -10px rgba(0,0,0,0.95);
    }
    .reel-spinning {
      filter: blur(1.5px);
      animation: reel-vibrate 0.08s infinite alternate ease-in-out;
    }
    @keyframes reel-vibrate {
      0% { transform: translateY(-3px); }
      100% { transform: translateY(3px); }
    }
    .reel-locked {
      animation: reel-bounce 0.32s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes reel-bounce {
      0% { transform: translateY(-16px) scale(0.92); }
      65% { transform: translateY(6px) scale(1.05); }
      100% { transform: translateY(0) scale(1); }
    }

    /* 3D Kart Animasyonları */
    .card-item {
      transform-style: preserve-3d;
      transition: all 0.65s cubic-bezier(0.2, 0.85, 0.32, 1.2);
    }
    .card-face {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .card-back {
      transform: rotateY(180deg);
    }
    .card-flipped {
      transform: rotateY(180deg);
    }
    .card-gathered {
      transform: translate(var(--gather-x, 0px), var(--gather-y, 0px)) rotate(var(--gather-rot, 0deg)) rotateY(180deg) scale(0.88) !important;
      z-index: 40 !important;
    }
    .card-selected-reveal {
      transform: scale(1.3) translateY(-25px) rotateY(0deg) !important;
      z-index: 50 !important;
      box-shadow: 0 0 35px rgba(245, 158, 11, 0.8), 0 25px 40px rgba(0,0,0,0.9) !important;
    }

    /* Kol Çekme Animasyonu */
    .lever-arm {
      transform-origin: bottom center;
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .lever-pulled {
      transform: rotateX(60deg) scaleY(0.7);
    }
  </style>
</head>
<body id="mainBody" class="casino-felt text-zinc-100 min-h-screen flex flex-col items-center justify-between overflow-hidden select-none font-sans antialiased">

  <!-- Alt Bar -->

  <script>
    let names = [
      "Ahmet", "Ayşe", "Mehmet", "Fatma", "Ali",
      "Zeynep", "Mustafa", "Elif", "Emre", "Burak",
      "Gamze", "Can", "Selin", "Kemal", "Büşra", "Deniz"
    ];

    let history = [];
    let currentWinner = null;
    let round = 1;
    let activeGameMode = 'wheel';
    let isPlaying = false;
    let pendingTarget = null;
    let activeIntervals = [];

    // Kart Oyununun Durumu
    let cardsState = 'opened'; // 'opened' | 'gathering' | 'shuffling' | 'closed_ready' | 'revealed'
    let cardMapping = []; // Her kart elementine karşılık gelen isim

    function clearAllIntervals() {
      activeIntervals.forEach(i => clearInterval(i));
      activeIntervals = [];
    }

    // --- SFX Motoru ---
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        try {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        } catch (e) {
          audioCtx = null;
        }
      }
    }

    function playTick(freq = 700) {
      if (!soundEnabled) return;
      initAudio();
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 0.03);
        gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.005, audioCtx.currentTime + 0.03);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.03);
      } catch (e) {}
    }

    function playCardShuffleSound() {
      if (!soundEnabled) return;
      initAudio();
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
      for (let i = 0; i < 16; i++) {
        setTimeout(() => {
          if (!audioCtx) return;
          try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(500 + Math.random() * 450, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.025);
            gain.gain.setValueAtTime(0.14, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.025);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.025);
          } catch (e) {}
        }, i * 32);
      }
    }

    function playReelStopSound() {
      if (!soundEnabled) return;
      initAudio();
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
      try {
        const osc1 = audioCtx.createOscillator();
        const gain1 = audioCtx.createGain();
        osc1.type = 'triangle';
        osc1.frequency.setValueAtTime(110, audioCtx.currentTime);

    // --- 1. 3D ÇARKIFELEK ---
    const wheelCanvas = document.getElementById('wheelCanvas');
    const wheelCtx = wheelCanvas.getContext('2d');
    let wheelRadius = 0, wheelRotation = 0, lastWheelTickIndex = -1;
    const casinoPalette = ['#8f1d1d', '#18201d', '#155234', '#18201d', '#b3822a', '#18201d'];

    function resizeWheelCanvas() {
      const size = Math.min(window.innerWidth * 0.85, window.innerHeight * 0.65, 500);
      const dpr = window.devicePixelRatio || 1;
      wheelCanvas.width = size * dpr;
      wheelCanvas.height = size * dpr;
      wheelCanvas.style.width = size + 'px';
      wheelCanvas.style.height = size + 'px';
      wheelCtx.scale(dpr, dpr);
      wheelRadius = size / 2;
      drawWheel();
    }

    function drawWheel() {
      if (!names.length) return;
      const N = names.length, arc = (2 * Math.PI) / N;
      const cx = wheelRadius, cy = wheelRadius, r = wheelRadius - 12;
      wheelCtx.clearRect(0, 0, wheelRadius * 2, wheelRadius * 2);

      for (let i = 0; i < N; i++) {
        const a = wheelRotation + i * arc;
        wheelCtx.beginPath();
        wheelCtx.fillStyle = casinoPalette[i % casinoPalette.length];
        wheelCtx.moveTo(cx, cy);
        wheelCtx.arc(cx, cy, r, a, a + arc);
        wheelCtx.fill();
        wheelCtx.strokeStyle = '#d4af37';
        wheelCtx.lineWidth = 1.5;
        wheelCtx.stroke();

        wheelCtx.save();
        wheelCtx.translate(cx, cy);
        wheelCtx.rotate(a + arc / 2);
        wheelCtx.textAlign = 'right';
        wheelCtx.fillStyle = '#fef3c7';
        const fontSize = Math.max(10, Math.min(14, Math.floor(wheelRadius / 17)));
        wheelCtx.font = `bold ${fontSize}px sans-serif`;
        let displayName = names[i];
        if (displayName.length > 12) displayName = displayName.substring(0, 11) + '…';
        wheelCtx.fillText(displayName, r - 20, fontSize / 3);
        wheelCtx.restore();
      }

      wheelCtx.beginPath();
      wheelCtx.arc(cx, cy, r + 5, 0, 2 * Math.PI);
      wheelCtx.strokeStyle = '#272017';
      wheelCtx.lineWidth = 12;
      wheelCtx.stroke();

      wheelCtx.beginPath();
      wheelCtx.arc(cx, cy, r + 10, 0, 2 * Math.PI);
      wheelCtx.strokeStyle = '#b48a3c';
      wheelCtx.lineWidth = 2;
      wheelCtx.stroke();
    }

    function spinWheel(targetName = null) {
      if (isPlaying || !names.length) return;
      isPlaying = true;
      broadcast({ type: 'spin_start' });

      const N = names.length, arc = (2 * Math.PI) / N;
      let targetIndex = targetName ? names.findIndex(n => n.trim().toLowerCase() === targetName.trim().toLowerCase()) : -1;
      const totalTurns = (6 + Math.floor(Math.random() * 3)) * 2 * Math.PI;
      let deltaRotation = 0;
      const POINTER_ANGLE = 1.5 * Math.PI;

      if (targetIndex !== -1) {
        const randInside = targetIndex * arc + (0.2 + Math.random() * 0.6) * arc;
        const desiredMod = ((POINTER_ANGLE - randInside) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
        const currentMod = (wheelRotation % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
        let diff = desiredMod - currentMod;
        if (diff < 0) diff += 2 * Math.PI;
        deltaRotation = totalTurns + diff;
      } else {
        deltaRotation = totalTurns + Math.random() * 2 * Math.PI;
      }

      const startRot = wheelRotation, finalRot = startRot + deltaRotation;
      const duration = 5000, startTime = performance.now();
      const pointerEl = document.getElementById('pointerEl');

      function anim(time) {
        const elapsed = time - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const ease = 1 - Math.pow(1 - progress, 5);
        wheelRotation = startRot + deltaRotation * ease;
        drawWheel();

        const curIdx = Math.floor(((POINTER_ANGLE - wheelRotation) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) / arc) % N;
        if (curIdx !== lastWheelTickIndex) {
          playTick(750);
          lastWheelTickIndex = curIdx;
          pointerEl.style.transform = 'translateX(-50%) rotate(-15deg)';
          setTimeout(() => pointerEl.style.transform = 'translateX(-50%) rotate(0deg)', 40);
        }

        if (progress < 1) requestAnimationFrame(anim);
        else {
          isPlaying = false;
          wheelRotation = finalRot;
          drawWheel();
          const winnerIdx = Math.floor(((POINTER_ANGLE - wheelRotation) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) / arc) % N;
          finishGame(names[winnerIdx], targetName !== null, '3D Çarkıfelek');
        }
      }
      requestAnimationFrame(anim);
    }

    // --- 3. 3D MONTE CARLO RULET MASASI (DERİN 3D ÇANAK & FİLDİŞİ TOP) ---
    const rouletteCanvas = document.getElementById('rouletteCanvas');
    const rouletteCtx = rouletteCanvas.getContext('2d');
    let rouletteRadius = 0, rouletteAngle = 0, ballAngle = 0;
    let rouletteWinningIndex = null;

    function resizeRouletteCanvas() {
      const size = Math.min(window.innerWidth * 0.88, window.innerHeight * 0.65, 520);
      const dpr = window.devicePixelRatio || 1;
      rouletteCanvas.width = size * dpr;
      rouletteCanvas.height = size * dpr;
      rouletteCanvas.style.width = size + 'px';
      rouletteCanvas.style.height = size + 'px';
      rouletteCtx.scale(dpr, dpr);
      rouletteRadius = size / 2;
      drawRoulette();
    }

    function drawRoulette(ballDist = null, ballZ = 0) {
      if (!names.length) return;
      const N = names.length;
      const arc = (2 * Math.PI) / N;
      const cx = rouletteRadius, cy = rouletteRadius;
      const R = rouletteRadius - 6;

      const rMahoganyOuter = R + 4;
      const rMahoganyInner = R - 16;
      const rPocketsOuter = R - 36;
      const rPocketsInner = R * 0.44;
      const rDeflector = (rMahoganyInner + rPocketsOuter) / 2;

      rouletteCtx.clearRect(0, 0, rouletteRadius * 2, rouletteRadius * 2);

      // 1. Maun Ahşap Dış Çanak (Derin Lake Gradient)
      const woodGrad = rouletteCtx.createRadialGradient(cx, cy, rMahoganyInner, cx, cy, rMahoganyOuter);
      woodGrad.addColorStop(0, '#251208');
      woodGrad.addColorStop(0.4, '#42200f');
      woodGrad.addColorStop(0.8, '#2a1409');
      woodGrad.addColorStop(1, '#150904');

      rouletteCtx.beginPath();
      rouletteCtx.arc(cx, cy, rMahoganyOuter, 0, 2 * Math.PI);
      rouletteCtx.fillStyle = woodGrad;
      rouletteCtx.fill();
      rouletteCtx.strokeStyle = '#d4af37';
      rouletteCtx.lineWidth = 4;
      rouletteCtx.stroke();

      // Maun Çanak İçi Yivli Altın Çember
      rouletteCtx.beginPath();
      rouletteCtx.arc(cx, cy, rMahoganyInner + 3.5, 0, 2 * Math.PI);
      rouletteCtx.strokeStyle = '#854d0e';
      rouletteCtx.lineWidth = 2;
      rouletteCtx.stroke();

      // 2. Fildişi Top Parkuru (Derin Yiv Kanalı)
      const trackGrad = rouletteCtx.createRadialGradient(cx, cy, rPocketsOuter, cx, cy, rMahoganyInner);
      trackGrad.addColorStop(0, '#0a0604');
      trackGrad.addColorStop(0.65, '#1e1109');
      trackGrad.addColorStop(1, '#080402');

      rouletteCtx.beginPath();
      rouletteCtx.arc(cx, cy, rMahoganyInner, 0, 2 * Math.PI);
      rouletteCtx.fillStyle = trackGrad;
      rouletteCtx.fill();

      // 3. 8 Pirinç Elmas Saptırıcı (3D Şevli Brass Deflectors)
      for (let d = 0; d < 8; d++) {
        const da = (d * Math.PI) / 4;
        const dx = cx + rDeflector * Math.cos(da);
        const dy = cy + rDeflector * Math.sin(da);

        rouletteCtx.save();
        rouletteCtx.translate(dx, dy);
        rouletteCtx.rotate(da);

        // Elmas Gölgesi
        rouletteCtx.beginPath();
        rouletteCtx.moveTo(0, -6);
        rouletteCtx.lineTo(4, 0);
        rouletteCtx.lineTo(0, 6);
        rouletteCtx.lineTo(-4, 0);
        rouletteCtx.closePath();
        rouletteCtx.fillStyle = 'rgba(0,0,0,0.45)';
        rouletteCtx.fill();

        // 3D Işık Açılı Elmas Gövde
        rouletteCtx.beginPath();
        rouletteCtx.moveTo(0, -6);
        rouletteCtx.lineTo(3.5, 0);
        rouletteCtx.lineTo(0, 6);
        rouletteCtx.lineTo(-3.5, 0);
        rouletteCtx.closePath();
        rouletteCtx.fillStyle = '#fef08a';
        rouletteCtx.fill();
        rouletteCtx.strokeStyle = '#854d0e';
        rouletteCtx.lineWidth = 1;
        rouletteCtx.stroke();

        rouletteCtx.restore();
      }

      // 4. Çukur Cepler Halkası (Kırmızı & Siyah Lake - Sıfır Yazı)
      for (let i = 0; i < N; i++) {
        const a = rouletteAngle + i * arc;
        const isRed = (i % 2 === 0);

        rouletteCtx.beginPath();
        rouletteCtx.moveTo(cx + rPocketsInner * Math.cos(a), cy + rPocketsInner * Math.sin(a));
        rouletteCtx.arc(cx, cy, rPocketsOuter, a, a + arc);
        rouletteCtx.lineTo(cx + rPocketsInner * Math.cos(a + arc), cy + rPocketsInner * Math.sin(a + arc));
        rouletteCtx.arc(cx, cy, rPocketsInner, a + arc, a, true);
        rouletteCtx.closePath();

        // Derinlik Gradyanı (İçe doğru kararan lüks lake kavis)
        const pocketGrad = rouletteCtx.createRadialGradient(cx, cy, rPocketsInner, cx, cy, rPocketsOuter);
        if (isRed) {
          pocketGrad.addColorStop(0, '#580c0c');
          pocketGrad.addColorStop(0.7, '#8f1a1a');
          pocketGrad.addColorStop(1, '#b91c1c');
        } else {
          pocketGrad.addColorStop(0, '#09090b');
          pocketGrad.addColorStop(0.7, '#18181b');
          pocketGrad.addColorStop(1, '#27272a');
        }

        rouletteCtx.fillStyle = pocketGrad;
        rouletteCtx.fill();

        // Pirinç Ayırıcı Perdeler (Frets)
        rouletteCtx.strokeStyle = '#d4af37';
        rouletteCtx.lineWidth = 1.4;
        rouletteCtx.stroke();
      }

      // 5. Pirinç Merkez Kule (Turret Cone & Spindle)
      const coneGrad = rouletteCtx.createRadialGradient(cx, cy, 0, cx, cy, rPocketsInner);
      coneGrad.addColorStop(0, '#fef08a');
      coneGrad.addColorStop(0.35, '#ca8a04');
      coneGrad.addColorStop(0.65, '#854d0e');
      coneGrad.addColorStop(1, '#27170b');

      rouletteCtx.beginPath();
      rouletteCtx.arc(cx, cy, rPocketsInner, 0, 2 * Math.PI);
      rouletteCtx.fillStyle = coneGrad;
      rouletteCtx.fill();
      rouletteCtx.strokeStyle = '#fef08a';
      rouletteCtx.lineWidth = 2.5;
      rouletteCtx.stroke();

      // Döner 4 Kollu Pirinç Fırıldak (Spindle Cross with 3D Float Shadow)
      for (let i = 0; i < 4; i++) {
        const ca = rouletteAngle + (i * Math.PI) / 2;
        const hLen = rPocketsInner * 0.88;
        const hx = cx + hLen * Math.cos(ca);
        const hy = cy + hLen * Math.sin(ca);

        rouletteCtx.save();
        rouletteCtx.shadowColor = 'rgba(0, 0, 0, 0.65)';
        rouletteCtx.shadowBlur = 6;
        rouletteCtx.shadowOffsetY = 4;

        rouletteCtx.beginPath();
        rouletteCtx.moveTo(cx, cy);
        rouletteCtx.lineTo(hx, hy);
        rouletteCtx.strokeStyle = '#fde047';
        rouletteCtx.lineWidth = 4;
        rouletteCtx.stroke();

        rouletteCtx.beginPath();
        rouletteCtx.arc(hx, hy, 5, 0, 2 * Math.PI);
        rouletteCtx.fillStyle = '#fef08a';
        rouletteCtx.fill();
        rouletteCtx.strokeStyle = '#854d0e';
        rouletteCtx.lineWidth = 1.2;
        rouletteCtx.stroke();

        rouletteCtx.restore();
      }

      // Merkez Yakut Somun (Ruby Cap Apex)
      rouletteCtx.beginPath();
      rouletteCtx.arc(cx, cy, 10, 0, 2 * Math.PI);
      rouletteCtx.fillStyle = '#991b1b';
      rouletteCtx.fill();
      rouletteCtx.strokeStyle = '#fef08a';
      rouletteCtx.lineWidth = 2.5;
      rouletteCtx.stroke();

      // Yakut Işıltı Noktası
      rouletteCtx.beginPath();
      rouletteCtx.arc(cx - 3, cy - 3, 3, 0, 2 * Math.PI);
      rouletteCtx.fillStyle = 'rgba(255, 255, 255, 0.9)';
      rouletteCtx.fill();

      // 6. 3D Parlak Fildişi Top (Dinamik Yükseklik, Kenar Çarpma ve Işık-Gölge Simülasyonu)
      if (ballDist !== null) {
        const bx = cx + ballDist * Math.cos(ballAngle);
        const by = cy + ballDist * Math.sin(ballAngle);

        const z = Math.max(0, Math.min(1, ballZ));

        // Derinlik Perspektif Büyüklüğü (Yukarıdayken kameraya daha yakın, daha büyük)
        const ballSize = 6.2 + 2.8 * z;

        // Dinamik Zemin Gölgesi (Sol-üstten ışık, yüksekteyken gölge uzağa düşer ve yayılır)
        const shadowDist = 2.0 + 8.0 * z;
        const shadowBlur = 2.0 + 7.5 * z;
        const shadowOpacity = 0.72 - 0.28 * z;

        rouletteCtx.save();
        rouletteCtx.beginPath();
        rouletteCtx.arc(bx + shadowDist * 0.7, by + shadowDist * 0.7, ballSize * (1 + 0.2 * z), 0, 2 * Math.PI);
        rouletteCtx.fillStyle = `rgba(0, 0, 0, ${shadowOpacity})`;
        rouletteCtx.shadowColor = 'rgba(0, 0, 0, 0.8)';
        rouletteCtx.shadowBlur = shadowBlur;
        rouletteCtx.fill();
        rouletteCtx.restore();

        // 3D Küresel Fildişi Işıklandırması
        rouletteCtx.save();
        const lightOffsetX = -ballSize * 0.35;
        const lightOffsetY = -ballSize * 0.35;
        const ballGrad = rouletteCtx.createRadialGradient(
          bx + lightOffsetX,
          by + lightOffsetY,
          0.8,
          bx,
          by,
          ballSize + 1.2
        );
        ballGrad.addColorStop(0, '#ffffff');
        ballGrad.addColorStop(0.35, '#fafaf9');
        ballGrad.addColorStop(0.70, '#e5e7eb');
        ballGrad.addColorStop(0.92, '#9ca3af');
        ballGrad.addColorStop(1, '#4b5563');

        rouletteCtx.beginPath();
        rouletteCtx.arc(bx, by, ballSize, 0, 2 * Math.PI);
        rouletteCtx.fillStyle = ballGrad;
        rouletteCtx.shadowColor = 'rgba(255, 255, 255, 0.6)';
        rouletteCtx.shadowBlur = 4;
        rouletteCtx.fill();

        // Top Yüzey Parıltısı
        rouletteCtx.beginPath();
        rouletteCtx.arc(bx + lightOffsetX, by + lightOffsetY, ballSize * 0.25, 0, 2 * Math.PI);
        rouletteCtx.fillStyle = 'rgba(255, 255, 255, 0.9)';
        rouletteCtx.fill();

        rouletteCtx.restore();
      }
    }

    function spinRoulette(targetName = null) {
      if (isPlaying || !names.length) return;
      isPlaying = true;
      broadcast({ type: 'spin_start' });

      const stage3D = document.getElementById('roulette3DStage');
      if (stage3D) {
        stage3D.classList.remove('roulette-zoom-winner');
        stage3D.classList.add('roulette-spinning-cam');
      }

      let targetIndex = targetName ? names.findIndex(n => n.trim().toLowerCase() === targetName.trim().toLowerCase()) : -1;
      if (targetIndex === -1 && names.length > 0) targetIndex = Math.floor(Math.random() * names.length);
      if (targetIndex < 0 || targetIndex >= names.length) targetIndex = 0;

      const N = names.length, arc = (2 * Math.PI) / N;
      const R = rouletteRadius - 6;
      const rMahoganyInner = R - 16;
      const rPocketsOuter = R - 36;
      const rPocketsInner = R * 0.44;
      const rPocketCenter = (rPocketsOuter + rPocketsInner) / 2;
      const rDeflector = (rMahoganyInner + rPocketsOuter) / 2;

      const duration = 6200;
      const startTime = performance.now();

      const startWheelAngle = rouletteAngle;
      const totalWheelTurns = (3.8 + Math.random() * 0.4) * 2 * Math.PI;
      const finalWheelAngle = startWheelAngle + totalWheelTurns;
      const targetPocketAngle = finalWheelAngle + targetIndex * arc + arc / 2;

      const startBallAngle = ballAngle;
      const desiredMod = ((targetPocketAngle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
      const currentMod = ((startBallAngle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
      let ballDiff = currentMod - desiredMod;
      if (ballDiff < 0) ballDiff += 2 * Math.PI;
      const totalBackwardTurns = (8 * 2 * Math.PI) + ballDiff;
      const finalBallAngle = startBallAngle - totalBackwardTurns;

      let lastPipTime = 0;
      let hitRim1 = false;
      let hitDeflector1 = false;
      let hitDeflector2 = false;
      let fretBounceCount = 0;

      function anim(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);

        // Çark Dönüşü
        const wheelEase = 1 - Math.pow(1 - progress, 2.6);
        rouletteAngle = startWheelAngle + totalWheelTurns * wheelEase;

        // Top Açısal Hızı
        const ballEase = 1 - Math.pow(1 - progress, 3.4);
        ballAngle = startBallAngle - totalBackwardTurns * ballEase;

        // --- ÇOK AŞAMALI FİZİK: DÜŞÜŞ, KENARA ÇARPMA VE SEKME SİMÜLASYONU ---
        let ballDist = rMahoganyInner - 4.5;
        let ballZ = 0.96;

        if (progress < 0.48) {
          // AŞAMA 1: Dış Parkurda Yüksek Hızlı Dönüş
          const wobble = Math.sin(elapsed * 0.04) * 0.5;
          ballDist = rMahoganyInner - 4.5 + wobble;
          ballZ = 0.95 - progress * 0.08;

        } else if (progress >= 0.48 && progress < 0.58) {
          // AŞAMA 2: Hız Kaybı & Dış Ahşap Kenara Sert Çarpma (Rim Clash)
          const pSub = (progress - 0.48) / 0.10;
          const rimClashBounce = Math.sin(pSub * Math.PI * 3) * (1 - pSub) * 3.5;
          ballDist = (rMahoganyInner - 5.0) - pSub * 3.0 + rimClashBounce;
          const verticalBounce = Math.abs(Math.sin(pSub * Math.PI * 2)) * (1 - pSub) * 0.15;
          ballZ = 0.90 - pSub * 0.12 + verticalBounce;

          if (progress >= 0.50 && !hitRim1) {
            hitRim1 = true;
            playIvoryBallClick(1450, 0.24);
          }

        } else if (progress >= 0.58 && progress < 0.76) {
          // AŞAMA 3: Eğimden Aşağı Düşüş & Pirinç Elmas Saptırıcılara Çarpışma
          const pSub = (progress - 0.58) / 0.18;
          let baseDist = (rMahoganyInner - 8.0) - pSub * (rMahoganyInner - 8.0 - rDeflector);
          let baseZ = 0.78 - pSub * 0.40;

          // 1. Elmas Saptırıcı Çarpışması (~0.63)
          if (progress >= 0.63 && progress < 0.69) {
            const pHit = (progress - 0.63) / 0.06;
            baseDist += Math.sin(pHit * Math.PI) * 6.5;
            baseZ += Math.sin(pHit * Math.PI) * 0.22;
            if (!hitDeflector1) {
              hitDeflector1 = true;
              playDeflectorHit();
            }
          }

          // 2. Elmas Saptırıcı Çarpışması (~0.70)
          if (progress >= 0.70 && progress < 0.76) {
            const pHit = (progress - 0.70) / 0.06;
            baseDist += Math.sin(pHit * Math.PI) * 5.0;
            baseZ += Math.sin(pHit * Math.PI) * 0.18;
            if (!hitDeflector2) {
              hitDeflector2 = true;
              playDeflectorHit();
            }
          }

          ballDist = baseDist;
          ballZ = baseZ;

        } else if (progress >= 0.76 && progress < 0.96) {
          // AŞAMA 4: Ceplere İniş & Pirinç Perdeler Arasında Sekerek İlerleme (Fret Hopping)
          const pSub = (progress - 0.76) / 0.20;
          const hops = 5;
          const hopPhase = pSub * hops * Math.PI;
          const decay = Math.pow(1 - pSub, 1.5);
          
          const hopHeight = Math.abs(Math.sin(hopPhase)) * decay * 0.42;
          ballZ = hopHeight;

          const radialHop = Math.sin(hopPhase * 2) * decay * 4.0;
          const baseDist = rDeflector - pSub * (rDeflector - rPocketCenter);
          ballDist = baseDist + radialHop;

          const currentBounceIndex = Math.floor(pSub * hops);
          if (currentBounceIndex > fretBounceCount) {
            fretBounceCount = currentBounceIndex;
            playIvoryBallClick(820 + Math.random() * 180, 0.18);
          }

        } else {
          // AŞAMA 5: Hedef Cebe Tam Oturma & Kilitlenme (Resting)
          const pSub = (progress - 0.96) / 0.04;
          const settleDecay = 1 - pSub;
          ballDist = rPocketCenter + settleDecay * 1.5 * Math.sin(pSub * Math.PI * 3);
          ballZ = Math.max(0, settleDecay * 0.04);
        }

        drawRoulette(ballDist, ballZ);

        // Fildişi Top Tıkırtıları (Dış parkurda)
        if (progress < 0.48) {
          if (now - lastPipTime > (50 + progress * 180)) {
            playIvoryBallClick(1250 + Math.random() * 180, 0.08);
            lastPipTime = now;
          }
        }

        if (progress < 1) {
          requestAnimationFrame(anim);
        } else {
          isPlaying = false;
          rouletteWinningIndex = targetIndex;
          rouletteAngle = finalWheelAngle;
          ballAngle = targetPocketAngle;
          drawRoulette(rPocketCenter, 0);
          playIvoryBallClick(620, 0.25);
          playDollySound();

          if (stage3D) {
            stage3D.classList.remove('roulette-spinning-cam');
            stage3D.classList.add('roulette-zoom-winner');
          }

          const winnerName = names[targetIndex];

          setTimeout(() => {
            finishGame(winnerName, targetName !== null, '3D Monte Carlo Ruleti');
          }, 1200);
        }
      }
      requestAnimationFrame(anim);
    }

    // --- 4. 3D KART MASASI (KİŞİ SAYISI KADAR KART, SHUFFLE & SİHİRBAZ HİLESİ) ---

          </div>

          <!-- Arka Yüz: Kapalı Casino Deseni -->
          <div class="card-face card-back absolute inset-0 rounded-xl bg-gradient-to-br from-red-950 via-zinc-950 to-red-950 border-2 border-amber-600 flex flex-col items-center justify-center p-2 shadow-2xl">
            <div class="w-full h-full border border-amber-600/40 rounded-lg flex items-center justify-center bg-black/30">
              <span class="text-2xl text-amber-500/90 font-serif">♠</span>

          </div>
        `;

        // Masadaki karta dokunulduğunda açma
        card.addEventListener('click', () => {
          if (cardsState === 'closed_ready' && !isPlaying) {
            revealCard(i);
          } else if (cardsState === 'opened' && !isPlaying) {

    // Kartları Ortaya Topla, Ters Çevir ve Karıştır
    function shuffleCardsDeck(onComplete = null) {
      if (isPlaying || cardsState === 'shuffling') return;
      isPlaying = true;
      cardsState = 'shuffling';
      broadcast({ type: 'spin_start' });
      document.getElementById('cardsShuffleBtn').disabled = true;
      document.getElementById('cardsPickRandomBtn').disabled = true;
      document.getElementById('cardsStatusLabel').textContent = 'Kartlar toplanıyor ve destede karıştırılıyor...';

      const cardEls = document.querySelectorAll('.card-item');
      const container = document.getElementById('cardsGrid');
      const containerRect = container.getBoundingClientRect();
      const centerX = containerRect.left + containerRect.width / 2;
      const centerY = containerRect.top + containerRect.height / 2;

      playCardShuffleSound();

      // 1. ADIM: Tüm kartları ters çevirip ortaya topla
      cardEls.forEach((card, i) => {
        const rect = card.getBoundingClientRect();
        const cardCenterX = rect.left + rect.width / 2;
        const cardCenterY = rect.top + rect.height / 2;
        const dx = centerX - cardCenterX;
        const dy = centerY - cardCenterY;
        const randRot = (Math.random() * 16 - 8);

        card.style.setProperty('--gather-x', `${dx}px`);
        card.style.setProperty('--gather-y', `${dy}px`);
        card.style.setProperty('--gather-rot', `${randRot}deg`);

        setTimeout(() => {
          card.classList.add('card-gathered');
          card.classList.add('card-flipped'); // Ters çevir
        }, i * 20);
      });

      // 2. ADIM: Ortada desteyi karıştır (Riffle jitter effect)
      setTimeout(() => {
        playCardShuffleSound();
        cardEls.forEach((card) => {
          const jitterX = (Math.random() * 30 - 15);
          card.style.setProperty('--gather-x', `calc(var(--gather-x) + ${jitterX}px)`);
        });
      }, 1100);

      // 3. ADIM: Tekrar masaya kapalı olarak dağıt!
      setTimeout(() => {
        document.getElementById('cardsStatusLabel').textContent = 'Kartlar kapalı dağıtıldı! İstediğiniz bir karta dokunun veya butona basın.';
        cardEls.forEach((card, i) => {
          setTimeout(() => {
            playCardDealSound();
            card.classList.remove('card-gathered');
            // card-flipped kalıyor (yani kapalı kalıyor)
          }, i * 30);
        });

        setTimeout(() => {
          isPlaying = false;
          cardsState = 'closed_ready';
          document.getElementById('cardsPickRandomBtn').disabled = false;
          document.getElementById('cardsShuffleBtn').disabled = false;
          document.getElementById('cardsShuffleBtn').textContent = 'TEKRAR KARIŞTIR';

          if (typeof onComplete === 'function') {
            onComplete();
          }
        }, cardEls.length * 30 + 350);

      }, 2000);
    }

    // KART SEÇİMİ VE SİHİRBAZLIK AÇILIŞI (FORCED MAGIC TRICK)
    function revealCard(clickedIndex) {
      if (isPlaying || cardsState !== 'closed_ready') return;
      isPlaying = true;
      cardsState = 'revealed';
      document.getElementById('cardsPickRandomBtn').disabled = true;
      document.getElementById('cardsShuffleBtn').disabled = true;

      // HİLE KURALI:
      // Eğer bir pendingTarget (gizli hedef) varsa, tıklanan bu kart KESİNLİKLE o hedef olur!
      let winner = pendingTarget;
      const matched = names.find(n => n.trim().toLowerCase() === (winner || '').trim().toLowerCase());
      if (matched) {
        winner = matched;
      } else {
        winner = names[Math.floor(Math.random() * names.length)] || names[0] || 'Şanslı Kişi';
      }

      // Kalan isimleri diğer kartlara paylaştır (böylece masada her isim tutarlı kalır)
      const otherNames = names.filter(n => n !== winner).sort(() => Math.random() - 0.5);

      let otherIdx = 0;
      names.forEach((_, i) => {
        const cardEl = document.getElementById('cardIndex_' + i);
        if (!cardEl) return;
        const nameSpan = cardEl.querySelector('.card-student-name');
        if (!nameSpan) return;
        if (i === clickedIndex) {
          nameSpan.textContent = winner;
        } else {
          nameSpan.textContent = otherNames[otherIdx++] || names[i];
        }
      });

      // Tıklanan kartı görkemli şekilde havaya kaldırıp aç
      const selectedCard = document.getElementById('cardIndex_' + clickedIndex);
      playWinSound();

      selectedCard.classList.remove('card-flipped'); // Ön yüzünü aç
      selectedCard.classList.add('card-selected-reveal');

      document.getElementById('cardsStatusLabel').textContent = `Seçilen Kart Açıldı: ${winner}!`;

      setTimeout(() => {
        isPlaying = false;
        finishGame(winner, pendingTarget !== null, '3D Gizemli Kart Masası');
      }, 1600);
    }

    function pickRandomCard() {
      if (isPlaying) return;
      if (cardsState === 'closed_ready') {
        const randIdx = Math.floor(Math.random() * names.length);
        revealCard(randIdx);
      } else if (cardsState === 'opened') {
        shuffleCardsDeck(() => {
          setTimeout(() => {
            const randIdx = Math.floor(Math.random() * names.length);
            revealCard(randIdx);
          }, 300);
        });
      }
    }

    // --- GENEL TETİKLEME ---
    function triggerGame(target = null) {
      pendingTarget = target;
      if (activeGameMode === 'wheel') spinWheel(target);
      else if (activeGameMode === 'slot') spinSlot(target);
      else if (activeGameMode === 'roulette') spinRoulette(target);
      else if (activeGameMode === 'cards') {
        pickRandomCard();
      }
    }

    function finishGame(winner, wasTargeted, gameLabel) {
      currentWinner = winner;
      addHistoryRecord(winner, round, wasTargeted, gameLabel);
      round++;
      updateRoundUI();

      triggerScreenShake();
      playWinSound();
      triggerCelebration(winner, gameLabel);

      broadcast({
        type: 'spin_end',
        winner: winner,
        history: history,
        names: names
      });
    }

    function triggerCelebration(winner, gameLabel) {
      document.getElementById('winnerName').textContent = winner;
      document.getElementById('winnerGameLabel').textContent = gameLabel || 'KAZANAN';
      const modal = document.getElementById('winnerModal');
      const card = document.getElementById('winnerCard');
      modal.classList.remove('opacity-0', 'pointer-events-none');
      card.classList.remove('scale-95');
      card.classList.add('scale-100');
    }

    function addHistoryRecord(winner, roundNumber, wasTargeted, gameLabel) {
      const timeStr = new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      history.unshift({ round: roundNumber, winner: winner, time: timeStr, wasTargeted: wasTargeted, game: gameLabel });
      saveStorage();
      renderHistoryUI();
    }

    function renderHistoryUI() {
      const list = document.getElementById('historyList');
      document.getElementById('historyCount').textContent = history.length;
      document.getElementById('totalSpinsCount').textContent = 'Toplam: ' + history.length;
      if (!history.length) {
        list.innerHTML = `<div class="text-center py-8 text-xs text-zinc-600">Henüz çekiliş yapılmadı.</div>`;
        return;

      list.innerHTML = history.map(item => `

          <div>
            <div class="flex items-center gap-2">
              <span class="text-amber-500 font-mono font-bold">#${item.round}</span>
              <span class="text-zinc-200 font-semibold">${item.winner}</span>
            </div>
            <div class="text-[10px] text-zinc-500">${item.game || 'Oyun'}</div>
          </div>
          <span class="text-[10px] text-zinc-500 font-mono">${item.time}</span>
        </div>
      `).join('');

    function updateRoundUI() {
      document.getElementById('roundCounter').textContent = round;
      document.getElementById('studentCount').textContent = names.length;
    }

    function loadStorage() {
      try {
        const sNames = localStorage.getItem('cark_names');
        if (sNames) names = JSON.parse(sNames);
        const sHist = localStorage.getItem('cark_history');
        if (sHist) { history = JSON.parse(sHist); round = history.length + 1; }
      } catch (e) {}
      updateRoundUI();
      renderHistoryUI();
    }

    function saveStorage() {
      try {
        localStorage.setItem('cark_names', JSON.stringify(names));
        localStorage.setItem('cark_history', JSON.stringify(history));
      } catch (e) {}
    }

    function closeModal() {
      document.getElementById('winnerModal').classList.add('opacity-0', 'pointer-events-none');
      if (activeGameMode === 'cards' && cardsState === 'revealed') {
        renderFullCardsShowcase();
      } else if (activeGameMode === 'roulette') {
        const stage3D = document.getElementById('roulette3DStage');
        if (stage3D) stage3D.classList.remove('roulette-spinning-cam', 'roulette-zoom-winner');
        const statusLabel = document.getElementById('rouletteCurrentNumber');
        if (statusLabel) statusLabel.textContent = 'Krupiye: "Faites vos jeux! (Bahisler açık)"';

      if (currentWinner) {
        names = names.filter(n => n !== currentWinner);
        saveStorage();
        updateRoundUI();
        if (activeGameMode === 'wheel') drawWheel();
        else if (activeGameMode === 'cards') renderFullCardsShowcase();
        else if (activeGameMode === 'roulette') drawRoulette();
        broadcast({ type: 'sync_names', names: names });
      }
      closeModal();
    }

    // --- PeerJS & MQTT ---
    let peer = null, connections = [], mqttClient = null, heartbeatInterval = null;
    const randomCode = Math.floor(1000 + Math.random() * 9000);
    const roomId = 'cark-' + randomCode;

    function initLobbyBroadcast() {
      try {
        mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
          clientId: 'host_' + roomId + '_' + Math.random().toString(16).substring(2, 8),
          clean: true, connectTimeout: 4000
        });
        mqttClient.on('connect', () => {
          sendHeartbeat();
          if (heartbeatInterval) clearInterval(heartbeatInterval);
          heartbeatInterval = setInterval(sendHeartbeat, 3000);
        });
      } catch (e) {}
    }

    function sendHeartbeat() {
      if (mqttClient && mqttClient.connected) {
        mqttClient.publish('carkifelek_public_rooms', JSON.stringify({
          roomId: roomId,
          title: 'Casino Masası #' + randomCode,
          gameMode: activeGameMode,
          studentCount: names.length,
          lastSeen: Date.now()
        }));
      }
    }

    function initPeer() {
      peer = new Peer(roomId);
      peer.on('open', (id) => {
        document.getElementById('roomIdDisplay').textContent = id;
        document.getElementById('statusDot').className = 'w-2 h-2 rounded-full bg-emerald-400';
        initLobbyBroadcast();
      });

      peer.on('connection', (conn) => {
        connections.push(conn);
        conn.on('open', () => {
          conn.send({
            type: 'init',
            names: names,
            history: history,
            gameMode: activeGameMode,
            isSpinning: isPlaying
          });
        });

        conn.on('data', (data) => {
          if (!data || !data.type) return;
          if (data.type === 'sync_names') {
            if (Array.isArray(data.names) && data.names.length) {
              names = data.names;
              saveStorage();
              updateRoundUI();
              if (activeGameMode === 'wheel') drawWheel();
              else if (activeGameMode === 'cards') renderFullCardsShowcase();
              else if (activeGameMode === 'roulette') drawRoulette();
            }
          } else if (data.type === 'spin') {
            closeModal();
            if (data.mode && data.mode !== activeGameMode) {
              setGameMode(data.mode, false);
            }
            let validTarget = data.target;
            if (validTarget && !names.some(n => n.trim().toLowerCase() === validTarget.trim().toLowerCase())) {
              validTarget = null;
            }
            triggerGame(validTarget);
          } else if (data.type === 'set_target') {
            let validTarget = data.target;
            if (validTarget && !names.some(n => n.trim().toLowerCase() === validTarget.trim().toLowerCase())) {
              validTarget = null;
            }
            pendingTarget = validTarget;
          } else if (data.type === 'set_game_mode') {
            setGameMode(data.mode, false);
          } else if (data.type === 'remove_name') {
            names = names.filter(n => n !== data.name);
            if (names.length === 0) names = ["Ahmet", "Ayşe", "Mehmet"];
            saveStorage();
            updateRoundUI();
            if (activeGameMode === 'wheel') drawWheel();
            else if (activeGameMode === 'cards') renderFullCardsShowcase();
            else if (activeGameMode === 'roulette') drawRoulette();
          }
        });

        conn.on('close', () => { connections = connections.filter(c => c !== conn); });
      });
    }

    function broadcast(data) {
      connections.forEach(conn => {
        if (conn && conn.open) try { conn.send(data); } catch (e) {}
      });
    }

    window.addEventListener('resize', () => {
      if (activeGameMode === 'wheel') resizeWheelCanvas();
      else if (activeGameMode === 'roulette') resizeRouletteCanvas();
    });

    window.addEventListener('DOMContentLoaded', () => {
      loadStorage();
      setGameMode('wheel', false);
      initPeer();
    });
  </script>
</body>
</html>
